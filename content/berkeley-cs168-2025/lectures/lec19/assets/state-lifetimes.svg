<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc"><title id="title">四类状态：建立者、键与失效条件</title><desc id="desc">DHCP分配租约，ARP缓存下一跳，NAT保持映射，TLS保存会话秘密；四者不能互相替代。</desc><style>:root{color:var(--diagram-ink,#243247)}@media(prefers-color-scheme:dark){:root{color:var(--diagram-ink-dark,#e5edf7)}}text{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:currentColor}rect,path{stroke:currentColor}.box{fill:none;stroke-width:2}.edge{fill:none;stroke-width:2;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="currentColor" stroke="none"/></marker></defs><text x="24" y="32" font-size="23">四类状态：建立者、键与失效条件</text><path class="edge" d="M330 120H390"/><path class="edge" d="M180 175V230"/><path class="edge" d="M540 175V230"/><path class="edge" d="M330 285H390"/><rect class="box" x="25" y="65" width="305" height="110" rx="9"/><text x="39" y="94" font-size="19">DHCP 租约</text><text x="39" y="120" font-size="19">主机配置 / 地址使用权</text><text x="39" y="146" font-size="19">续租或到期</text><rect class="box" x="390" y="65" width="305" height="110" rx="9"/><text x="404" y="94" font-size="19">ARP 邻居缓存</text><text x="404" y="120" font-size="19">本接口上的 IP → MAC</text><text x="404" y="146" font-size="19">老化或重新解析</text><rect class="box" x="25" y="230" width="305" height="110" rx="9"/><text x="39" y="259" font-size="19">NAT 映射</text><text x="39" y="285" font-size="19">内外端点与协议状态</text><text x="39" y="311" font-size="19">空闲回收或网关重启</text><rect class="box" x="390" y="230" width="305" height="110" rx="9"/><text x="404" y="259" font-size="19">TLS 会话</text><text x="404" y="285" font-size="19">对端认证与流量密钥</text><text x="404" y="311" font-size="19">握手失败 / 关闭 / 重建</text></svg>
