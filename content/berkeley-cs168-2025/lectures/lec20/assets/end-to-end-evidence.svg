<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc"><title id="title">成功证明应放在能验证目标的端点</title><desc id="desc">链路收到不证明应用处理，TCP确认不证明业务提交，TLS认证不证明业务语义正确；最终目标需应用端确认。</desc><style>:root{color:var(--diagram-ink,#243247)}@media(prefers-color-scheme:dark){:root{color:var(--diagram-ink-dark,#e5edf7)}}text{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:currentColor}rect,path{stroke:currentColor}.box{fill:none;stroke-width:2}.edge{fill:none;stroke-width:2;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="currentColor" stroke="none"/></marker></defs><text x="24" y="32" font-size="23">成功证明应放在能验证目标的端点</text><path class="edge" d="M360 130V165"/><path class="edge" d="M360 230V265"/><path class="edge" d="M360 330V365"/><rect class="box" x="25" y="65" width="670" height="65" rx="9"/><text x="39" y="94" font-size="19">链路交付：下一跳收到一帧</text><rect class="box" x="25" y="165" width="670" height="65" rx="9"/><text x="39" y="194" font-size="19">TCP / TLS：字节交付与信道安全</text><rect class="box" x="25" y="265" width="670" height="65" rx="9"/><text x="39" y="294" font-size="19">应用：请求是否合法？事务是否持久提交？</text><rect class="box" x="25" y="365" width="670" height="50" rx="9"/><text x="39" y="394" font-size="19">下层优化有价值，但不替代端点的完整检查</text></svg>
