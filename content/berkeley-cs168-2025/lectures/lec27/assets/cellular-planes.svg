<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 660" role="img" aria-labelledby="title desc">
<title id="title">蜂窝网络：改变接入路径，保持用户 IP</title>
<desc id="desc">数据路径由设备、当前基站、无线网关、分组网关和互联网组成。移动性管理器查询订户数据库并配置基站和网关。切换时用户 IP 保持不变，旧基站将缓存数据转交新基站，用户数据不经过数据库。</desc>
<style>:root{color:var(--diagram-ink,#1f2937);--data:#075985;--control:#9a3412}@media(prefers-color-scheme:dark){:root{color:var(--diagram-ink-dark,#e5e7eb);--data:#7dd3fc;--control:#fdba74}}text{fill:currentColor;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}.box{fill:none;stroke:currentColor;stroke-width:2}.data{fill:none;stroke:var(--data,#075985);stroke-width:3}.control{fill:none;stroke:var(--control,#9a3412);stroke-width:2;stroke-dasharray:7 5}.caption{font-size:19px}</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs>
<text x="30" y="38" font-size="25">数据平面：按已配置路径转发用户数据</text>
<g class="box"><rect x="25" y="140" width="105" height="65" rx="8"/><rect x="205" y="75" width="115" height="65" rx="8"/><rect x="205" y="260" width="115" height="65" rx="8"/><rect x="410" y="140" width="120" height="65" rx="8"/><rect x="595" y="140" width="120" height="65" rx="8"/></g>
<g font-size="20" text-anchor="middle"><text x="77" y="179">设备</text><text x="262" y="114">旧基站</text><text x="262" y="299">新基站</text><text x="470" y="179">无线网关</text><text x="655" y="179">分组网关</text></g>
<path class="data" stroke-dasharray="7 5" d="M130 155L205 110M320 110L410 155"/>
<path class="data" marker-end="url(#a)" d="M130 190L205 285"/><path class="data" marker-end="url(#a)" d="M320 285L410 190"/>
<path class="data" marker-end="url(#a)" d="M530 172H590"/><path class="data" marker-end="url(#a)" d="M715 172H805"/>
<text x="760" y="140" text-anchor="middle" class="caption">互联网</text>
<path class="data" marker-end="url(#a)" d="M262 145V250"/><text x="278" y="224" class="caption">转交缓存</text>
<text x="78" y="235" text-anchor="middle" class="caption">IP 不变</text>
<text x="30" y="380" font-size="25">控制平面：认证、授权、位置与路径更新</text>
<g class="box"><rect x="340" y="470" width="180" height="70" rx="8"/><rect x="625" y="470" width="170" height="70" rx="8"/></g>
<g font-size="22" text-anchor="middle"><text x="430" y="512">移动性管理器</text><text x="710" y="512">订户数据库</text></g>
<path class="control" marker-start="url(#a)" marker-end="url(#a)" d="M525 505H620"/>
<path class="control" marker-end="url(#a)" d="M380 465L270 330"/><path class="control" marker-end="url(#a)" d="M450 465L470 210"/><path class="control" marker-end="url(#a)" d="M500 465L655 210"/>
<text x="560" y="454" class="caption">下发配置</text>
<text x="30" y="588" font-size="21">实线：数据；虚线控制箭头：查询与配置</text>
<text x="30" y="626" font-size="21">数据库不是用户业务包的下一跳；接入点变化需要状态更新</text>
</svg>
