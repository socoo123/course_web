<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 370" role="img" aria-labelledby="title desc"><title id="title">锯齿窗口面积</title><desc id="desc">窗口从最大值的一半逐轮加一，周期面积约为八分之三最大窗口平方。</desc><style>svg{color:#172033;--accent:#075985;--warn:#a33a14}text{fill:currentColor;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;font-size:18px}.line{stroke:currentColor;stroke-width:2;fill:none}.accent{stroke:var(--accent,#075985);stroke-width:3;fill:none}.box{stroke:currentColor;stroke-width:1.5;fill:none}.small{font-size:15px}@media(prefers-color-scheme:dark){svg{color:#e5e7eb;--accent:#7dd3fc;--warn:#fdba74}}</style><path class="line" d="M65 35V285H700"/><text class="small" x="20" y="28">窗口（包）</text><text class="small" x="575" y="320">时间（RTT轮数）</text><path class="accent" d="M85 215L300 75V215L515 75V215L685 105"/><path class="line" stroke-dasharray="5 5" d="M65 75H700M65 145H700M65 215H700"/><text class="small" x="8" y="80">W</text><text class="small" x="5" y="150">3W/4</text><text class="small" x="5" y="220">W/2</text><text x="340" y="185">面积 ≈ 3W²/8 包</text><text class="small" x="330" y="270">周期宽 ≈ W/2 轮</text><text class="small" x="80" y="345">固定 RTT、单包丢失、无超时、忽略慢启动；不是实测曲线</text></svg>
