<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 370" role="img" aria-labelledby="title desc"><title id="title">窗口控制与公平差值</title><desc id="desc">慢启动每ACK增加一包；拥塞避免每ACK增加窗口倒数；共同减半缩小差距。</desc><style>svg{color:#172033;--accent:#075985;--warn:#a33a14}text{fill:currentColor;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;font-size:18px}.line{stroke:currentColor;stroke-width:2;fill:none}.accent{stroke:var(--accent,#075985);stroke-width:3;fill:none}.box{stroke:currentColor;stroke-width:1.5;fill:none}.small{font-size:15px}@media(prefers-color-scheme:dark){svg{color:#e5e7eb;--accent:#7dd3fc;--warn:#fdba74}}</style><rect class="box" x="20" y="55" width="330" height="90" rx="8"/><text x="38" y="85">慢启动：每新 ACK +1 包</text><text x="38" y="118">低起点，按 RTT 近似翻倍</text><path class="line" d="M185 145V185"/><text class="small" x="205" y="170">达到阈值</text><rect class="box" x="20" y="185" width="330" height="90" rx="8"/><text x="38" y="215">拥塞避免：每 ACK +1/w</text><text x="38" y="248">按 RTT 近似 +1 包</text><text x="390" y="85">两个流的差值 d = x₂ − x₁</text><text x="390" y="135">共同加 a：d → d</text><text x="390" y="185">共同减半：d → d/2</text><text x="390" y="235">k 次减半：d → d/2ᵏ</text><path class="accent" d="M420 290L470 280L520 280L570 270L620 270L670 265"/><text class="small" x="390" y="325">只在共同反馈等模型假设下论证公平</text></svg>
