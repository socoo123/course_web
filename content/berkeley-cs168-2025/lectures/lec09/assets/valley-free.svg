<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" role="img" aria-labelledby="title desc"><style>:root{color:var(--diagram-ink,#1f2937)}@media(prefers-color-scheme:dark){:root{color:var(--diagram-ink-dark,#e5e7eb)}}</style><title id="title">商业策略推导的无谷路径形状</title><desc id="desc">路径先可沿客户到供应商的上坡边，至多一次对等边，之后只能沿供应商到客户的下坡边。下坡后不能返回上坡，也不能再走对等边。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="currentColor"/></marker></defs><g font-family="sans-serif, PingFang SC, Microsoft YaHei" fill="currentColor"><text x="25" y="32" font-size="23">不是最短路约束，而是“不替非客户免费中转”</text><g fill="none" stroke="currentColor" stroke-width="2"><rect x="65" y="105" width="180" height="70" rx="10"/><rect x="370" y="105" width="180" height="70" rx="10"/><rect x="675" y="105" width="180" height="70" rx="10"/><g marker-end="url(#a)"><path d="M245 140H370M550 140H675"/><path d="M150 105C65 30 245 30 180 105"/><path d="M750 105C675 30 855 30 790 105"/><path d="M245 172Q460 260 675 172"/></g></g><g font-size="22" text-anchor="middle"><text x="155" y="147">上坡阶段</text><text x="460" y="147">一次对等</text><text x="765" y="147">下坡阶段</text></g><g font-size="18"><text x="270" y="123">peer</text><text x="577" y="123">down</text><text x="135" y="63">up</text><text x="730" y="63">down</text><text x="415" y="225">可直接下坡</text><text x="25" y="275">路径形式：up* · peer? · down*；每个阶段都允许在目的地终止。</text><text x="25" y="305">客户路由可导出给所有类别；peer / provider 路由只导出给客户。</text></g></g></svg>