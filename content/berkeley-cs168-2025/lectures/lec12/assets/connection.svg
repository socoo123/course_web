<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 590" role="img" aria-labelledby="title desc">
<title id="title">SYN、数据与 FIN 的序号消耗</title><desc id="desc">A 初始序号1000，B初始序号8000。握手后A发送80字节，从1001到1080，随后FIN占1081，B确认1082；B仍可继续发送。</desc>
<style>:root{color:#1c3449;--ink:#1c3449;--a:#176b9a;--b:#9b4a24;--panel:#e8f1f7}text{fill:var(--ink,#1c3449);font:17px system-ui,"PingFang SC","Microsoft YaHei",sans-serif}.life{stroke:var(--ink,#1c3449);stroke-width:2}.a{stroke:var(--a,#176b9a);stroke-width:2;fill:none}.b{stroke:var(--b,#9b4a24);stroke-width:2;fill:none}.panel{fill:var(--panel,#e8f1f7)}@media(prefers-color-scheme:dark){:root{color:#e4eef7;--ink:#e4eef7;--a:#78cdf4;--b:#ffb68b;--panel:#253d51}}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--a,#176b9a)"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--b,#9b4a24)"/></marker></defs>
<text x="83" y="30">A</text><text x="725" y="30">B</text><path class="life" d="M100 45V530M730 45V530"/>
<path class="a" marker-end="url(#a)" d="M100 65L730 100"/><text x="230" y="65">SYN seq=1000（占 1 个序号）</text>
<path class="b" marker-end="url(#b)" d="M730 135L100 170"/><text x="225" y="135">SYN-ACK seq=8000, ack=1001</text>
<path class="a" marker-end="url(#a)" d="M100 205L730 240"/><text x="205" y="205">ACK seq=1001, ack=8001（无数据）</text>
<path class="a" marker-end="url(#a)" d="M100 275L730 310"/><text x="220" y="275">80 字节：[1001,1081)</text>
<path class="b" marker-end="url(#b)" d="M730 345L100 380"/><text x="325" y="345">ACK=1081</text>
<path class="a" marker-end="url(#a)" d="M100 415L730 450"/><text x="225" y="415">FIN seq=1081（占 1 个序号）</text>
<path class="b" marker-end="url(#b)" d="M730 485L100 520"/><text x="325" y="485">ACK=1082</text>
<rect class="panel" x="90" y="545" width="650" height="35" rx="6"/><text x="138" y="569">A→B 已结束；B→A 仍可发送，直到 B 自己发 FIN。</text>
</svg>
