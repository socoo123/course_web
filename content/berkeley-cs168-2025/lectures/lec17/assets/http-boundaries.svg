<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc"><title id="title">TCP 字节边界 ≠ HTTP 消息边界</title><desc id="desc">TCP 可任意分段交付，HTTP 解析器需要起始行、头与正文长度规则重建消息；业务成功另需应用语义。</desc><style>:root{color:var(--diagram-ink,#243247)}@media(prefers-color-scheme:dark){:root{color:var(--diagram-ink-dark,#e5edf7)}}text{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:currentColor}rect,path{stroke:currentColor}.box{fill:none;stroke-width:2}.edge{fill:none;stroke-width:2;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="currentColor" stroke="none"/></marker></defs><text x="24" y="32" font-size="23">TCP 字节边界 ≠ HTTP 消息边界</text><path class="edge" d="M180 140V190"/><path class="edge" d="M540 140V190"/><path class="edge" d="M180 280V335"/><path class="edge" d="M540 280V335"/><rect class="box" x="25" y="70" width="670" height="70" rx="9"/><text x="39" y="99" font-size="19">TCP：可靠、有序字节流，不保留 write/read 边界</text><rect class="box" x="25" y="190" width="310" height="90" rx="9"/><text x="39" y="219" font-size="19">HTTP 解析器</text><text x="39" y="245" font-size="19">起始行 → 头 → 正文</text><rect class="box" x="385" y="190" width="310" height="90" rx="9"/><text x="399" y="219" font-size="19">连接复用 / 多路复用</text><text x="399" y="245" font-size="19">不等于重复业务操作</text><rect class="box" x="25" y="335" width="670" height="65" rx="9"/><text x="39" y="364" font-size="19">HTTP 成功码、传输 ACK、业务提交：三种不同证据</text></svg>
