<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc"><style>:root{color:var(--diagram-ink,#1f2937)}@media(prefers-color-scheme:dark){:root{color:var(--diagram-ink-dark,#e5e7eb)}}</style><title id="title">固定目的地的有效状态与环路反例</title><desc id="desc">左侧 X 和 Z 的路径汇合于 Y，再到目的地 D。右侧 X 与 Y 相互转发，虽然各有下一跳，仍不能到达 D。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="currentColor"/></marker></defs><g font-family="sans-serif, PingFang SC, Microsoft YaHei" fill="currentColor"><text x="35" y="35" font-size="22">有效：每条路径最终进入 D</text><text x="490" y="35" font-size="22">无效：有下一跳仍可能成环</text><g fill="none" stroke="currentColor" stroke-width="2"><rect x="40" y="90" width="65" height="45" rx="5"/><rect x="40" y="195" width="65" height="45" rx="5"/><rect x="205" y="140" width="65" height="45" rx="5"/><circle cx="370" cy="162" r="28"/><rect x="510" y="120" width="65" height="45" rx="5"/><rect x="670" y="120" width="65" height="45" rx="5"/><circle cx="835" cy="142" r="28"/><g marker-end="url(#a)"><path d="M105 112L205 152"/><path d="M105 217L205 177"/><path d="M270 162H341"/><path d="M575 125Q620 75 670 125"/><path d="M670 157Q620 205 575 157"/></g></g><g font-size="22" text-anchor="middle"><text x="72" y="120">X</text><text x="72" y="225">Z</text><text x="237" y="170">Y</text><text x="370" y="170">D</text><text x="542" y="150">X</text><text x="702" y="150">Y</text><text x="835" y="150">D</text></g><text x="35" y="280" font-size="17">箭头来自转发表，不是所有物理链路。</text><text x="490" y="250" font-size="17">局部非空 ≠ 全局可达；固定表时重复节点即循环。</text></g></svg>