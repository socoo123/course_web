<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc" style="color:var(--diagram-text,#64748b)">
<style>@media (prefers-color-scheme: dark) { :root { --diagram-text: #e2e8f0; --diagram-fill: rgba(226,232,240,0.10); } }</style>
<title id="title">逐跳变化的链路首部与端到端消息</title>
<desc id="desc">主机 A 经路由器 R1、R2 到主机 B。三段链路上的链路目的地址依次是 R1、R2、B，IP 目的地址始终是 B。路由器查看 IP 首部后重新封装链路首部，不需要解释应用消息。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="currentColor"/></marker></defs>
<g font-family="system-ui, sans-serif" fill="currentColor" font-size="18" text-anchor="middle">
<text x="480" y="32" font-size="23">“交给下一跳”不等于“改变最终收件人”</text>
<g fill="none" stroke="currentColor" stroke-width="2"><circle cx="80" cy="95" r="30"/><rect x="320" y="65" width="60" height="60" rx="5"/><rect x="590" y="65" width="60" height="60" rx="5"/><circle cx="880" cy="95" r="30"/><path d="M112 95H309M382 95H579M652 95H839" marker-end="url(#arrow)"/></g>
<text x="80" y="101">A</text><text x="350" y="101">R1</text><text x="620" y="101">R2</text><text x="880" y="101">B</text>
<text x="210" y="78" font-size="15">链路 α</text><text x="480" y="78" font-size="15">链路 β</text><text x="750" y="78" font-size="15">链路 γ</text>
<g stroke="currentColor" stroke-width="1.5"><rect x="40" y="160" width="280" height="150" rx="8" fill="var(--diagram-fill,rgba(100,116,139,0.07))"/><rect x="340" y="160" width="280" height="150" rx="8" fill="var(--diagram-fill,rgba(100,116,139,0.07))"/><rect x="640" y="160" width="280" height="150" rx="8" fill="var(--diagram-fill,rgba(100,116,139,0.07))"/></g>
<text x="180" y="190">L2：A → R1</text><text x="480" y="190">L2：R1 → R2</text><text x="780" y="190">L2：R2 → B</text>
<g font-size="17"><text x="180" y="225">IP：A → B</text><text x="480" y="225">IP：A → B</text><text x="780" y="225">IP：A → B</text><text x="180" y="258">传输首部 + 应用消息</text><text x="480" y="258">传输首部 + 应用消息</text><text x="780" y="258">传输首部 + 应用消息</text></g>
<text x="480" y="350">路由器：解析入链路 → 查看 IP → 选择出口 → 出链路重新封装</text>
<text x="480" y="386" font-size="16">基础转发模型；忽略 NAT/隧道。目的地址不变，不代表 IP 首部所有字段不变。</text>
</g></svg>
