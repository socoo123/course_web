<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" role="img" aria-labelledby="title desc"><style>:root{color:var(--diagram-ink,#1f2937)}@media(prefers-color-scheme:dark){:root{color:var(--diagram-ink-dark,#e5e7eb)}}</style><title id="title">距离向量必须相加本地链路代价</title><desc id="desc">路由器 U 到 N1 链路代价为2，N1通告到D为5，总代价7。U到N2链路代价6，N2通告到D为2，总代价8，因此选择N1。通告指向U，数据从U流向N1。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="currentColor"/></marker></defs><g font-family="sans-serif, PingFang SC, Microsoft YaHei" fill="currentColor"><text x="25" y="32" font-size="22">U 比较的不是 5 与 2，而是 2+5 与 6+2</text><g fill="none" stroke="currentColor" stroke-width="2"><rect x="45" y="135" width="70" height="50" rx="6"/><rect x="330" y="70" width="90" height="50" rx="6"/><rect x="330" y="225" width="90" height="50" rx="6"/><path d="M115 145L330 95M115 175L330 250"/><path d="M320 65L155 115M320 280L155 215" stroke-dasharray="6 5" marker-end="url(#a)"/><path d="M135 150L305 110" marker-end="url(#a)"/></g><g font-size="23" text-anchor="middle"><text x="80" y="168">U</text><text x="375" y="103">N1</text><text x="375" y="258">N2</text></g><g font-size="19"><text x="240" y="145">c=2</text><text x="235" y="215">c=6</text><text x="460" y="95">通告：D 距离为 5</text><text x="460" y="124">候选：7 → 选用</text><text x="460" y="249">通告：D 距离为 2</text><text x="460" y="278">候选：8 → 拒绝</text><text x="25" y="307">虚线：路由通告；实线箭头：选择后的数据方向。D 不必是直接邻居。</text></g></g></svg>