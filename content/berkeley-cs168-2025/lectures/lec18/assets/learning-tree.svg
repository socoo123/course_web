<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc"><title id="title">源地址学习与去环是两个不同问题</title><desc id="desc">A到B的帧使交换机学习A的方向，却不能学习B。生成树关闭一条逻辑边以防泛洪循环。</desc><style>:root{color:var(--diagram-ink,#243247)}@media(prefers-color-scheme:dark){:root{color:var(--diagram-ink-dark,#e5edf7)}}text{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:currentColor}rect,path{stroke:currentColor}.box{fill:none;stroke-width:2}.edge{fill:none;stroke-width:2;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="currentColor" stroke="none"/></marker></defs><text x="24" y="32" font-size="23">源地址学习与去环是两个不同问题</text><path class="edge" d="M330 110H390"/><path class="edge" d="M180 150V205"/><path class="edge" d="M540 150V205"/><path class="edge" d="M390 245H330"/><path class="edge" d="M180 285V335"/><rect class="box" x="25" y="70" width="305" height="80" rx="9"/><text x="39" y="99" font-size="19">收到 From A, To B</text><text x="39" y="125" font-size="19">入端口 p</text><rect class="box" x="390" y="70" width="305" height="80" rx="9"/><text x="404" y="99" font-size="19">学习 A → p</text><text x="404" y="125" font-size="19">不能据此学习 B</text><rect class="box" x="25" y="205" width="305" height="80" rx="9"/><text x="39" y="234" font-size="19">B 已知：定向转发</text><text x="39" y="260" font-size="19">B 未知：泛洪</text><rect class="box" x="390" y="205" width="305" height="80" rx="9"/><text x="404" y="234" font-size="19">STP：先限制可转发边</text><text x="404" y="260" font-size="19">阻塞冗余用户数据路径</text><rect class="box" x="25" y="335" width="670" height="65" rx="9"/><text x="39" y="364" font-size="19">表项老化不是帧 TTL；已学习的表也不替代去环</text></svg>
