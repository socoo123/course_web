<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc"><title id="title">委派改变查找范围，TTL 改变可复用时间</title><desc id="desc">桩解析器向递归解析器请求最终答案。递归解析器缓存命中直接返回；未命中则跟随根到权威的转介。</desc><style>:root{color:var(--diagram-ink,#243247)}@media(prefers-color-scheme:dark){:root{color:var(--diagram-ink-dark,#e5edf7)}}text{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:currentColor}rect,path{stroke:currentColor}.box{fill:none;stroke-width:2}.edge{fill:none;stroke-width:2;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="currentColor" stroke="none"/></marker></defs><text x="24" y="32" font-size="23">委派改变查找范围，TTL 改变可复用时间</text><path class="edge" d="M305 103H385"/><path class="edge" d="M535 145V190"/><path class="edge" d="M385 230H305"/><path class="edge" d="M165 270V325"/><rect class="box" x="25" y="65" width="280" height="80" rx="9"/><text x="39" y="94" font-size="19">桩解析器</text><text x="39" y="120" font-size="19">要最终 A / AAAA 结果</text><rect class="box" x="385" y="65" width="305" height="80" rx="9"/><text x="399" y="94" font-size="19">递归解析器</text><text x="399" y="120" font-size="19">先查未过期缓存</text><rect class="box" x="385" y="190" width="305" height="80" rx="9"/><text x="399" y="219" font-size="19">缓存命中 → 回答</text><text x="399" y="245" font-size="19">未命中 → 迭代查询</text><rect class="box" x="25" y="190" width="280" height="80" rx="9"/><text x="39" y="219" font-size="19">根 → TLD → 子区</text><text x="39" y="245" font-size="19">转介不是最终主机地址</text><rect class="box" x="25" y="325" width="665" height="75" rx="9"/><text x="39" y="354" font-size="19">权威可改记录；已有缓存按剩余 TTL 使用</text><text x="39" y="380" font-size="19">可用性与更新速度之间存在权衡</text></svg>
