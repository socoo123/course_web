<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" role="img" aria-labelledby="title desc"><style>:root{color:var(--diagram-ink,#1f2937)}@media(prefers-color-scheme:dark){:root{color:var(--diagram-ink-dark,#e5e7eb)}}</style><title id="title">路由器快路径与慢路径</title><desc id="desc">普通包经物理链路处理、解析、最长前缀查找、修改首部、排队和交换结构转发。控制包和需要特殊处理的包交给控制CPU；CPU运行协议并安装转发表。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="currentColor"/></marker></defs><g font-family="sans-serif, PingFang SC, Microsoft YaHei" fill="currentColor"><text x="25" y="35" font-size="23">大多数包不经过通用控制 CPU</text><g fill="none" stroke="currentColor" stroke-width="2"><rect x="310" y="65" width="380" height="60" rx="7"/><rect x="20" y="210" width="120" height="55" rx="5"/><rect x="180" y="210" width="120" height="55" rx="5"/><rect x="340" y="210" width="120" height="55" rx="5"/><rect x="500" y="210" width="120" height="55" rx="5"/><rect x="660" y="210" width="120" height="55" rx="5"/><rect x="820" y="210" width="140" height="55" rx="5"/><g marker-end="url(#a)"><path d="M140 237H180M300 237H340M460 237H500M620 237H660M780 237H820"/><path d="M240 210V95H310"/><path d="M500 125V170H400V210" stroke-dasharray="6 5"/></g></g><g font-size="20" text-anchor="middle"><text x="500" y="91">控制 CPU：路由协议、特殊处理</text><text x="500" y="114" font-size="17">管理系统负责配置与监控</text><text x="80" y="244">PHY / MAC</text><text x="240" y="244">解析分类</text><text x="400" y="244">LPM 查表</text><text x="560" y="244">首部动作</text><text x="720" y="244">排队调度</text><text x="890" y="244">Fabric / 出口</text></g><g font-size="17"><text x="35" y="160">控制 / punt</text><text x="520" y="174">安装表项，不搬运每个用户包</text><text x="25" y="305">吞吐量由流水线与并行度共同决定；低查找复杂度不等于无限缓存或零排队。</text></g></g></svg>