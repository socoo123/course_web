<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">IPv4首部：沿转发链处理，载荷在端点解释</title><desc id="desc">接收方解析版本和长度，验证首部校验和；若需转发则检查TTL、递减并更新校验和，按目的地址决定出口和MTU处理。目的端用协议号将载荷交给上层。</desc><style>:root{--ink:#172033;--accent:#176b9a;--muted:#526173}@media(prefers-color-scheme:dark){:root{--ink:#e5edf5;--accent:#7dd3fc;--muted:#b8c5d5}}text{fill:var(--ink,#172033);font-family:system-ui,'PingFang SC',sans-serif;font-size:21px}.small{font-size:17px;fill:var(--muted,#526173)}rect{fill:none;stroke:var(--ink,#172033);stroke-width:2}path{fill:none;stroke:var(--accent,#176b9a);stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><polygon points="0,0 10,5 0,10" fill="var(--accent,#176b9a)"/></marker></defs><text x="28" y="36">收到一个 IPv4 包</text><rect x="30" y="60" width="380" height="85" rx="10"/><text x="48" y="94">解析 Version、IHL、Total Length</text><text class="small" x="48" y="124">长度自洽、字节可用，才可继续处理</text><path d="M410 102H470"/><rect x="478" y="60" width="390" height="85" rx="10"/><text x="498" y="94">验证 Header Checksum</text><text class="small" x="498" y="124">覆盖首部，不证明载荷正确或来源可信</text><path d="M675 150V182H230V215"/><path d="M675 150V215"/><rect x="30" y="220" width="395" height="160" rx="10"/><text x="48" y="254">需要继续转发</text><text class="small" x="48" y="286">TTL 耗尽 → 丢弃；否则递减 TTL</text><text class="small" x="48" y="315">按目的地址选路，检查出口 MTU</text><text class="small" x="48" y="344">首部改变 → 更新校验和后发送</text><rect x="478" y="220" width="390" height="160" rx="10"/><text x="498" y="254">已经到达目的端</text><text class="small" x="498" y="286">必要时重组 IPv4 分片</text><text class="small" x="498" y="315">Protocol 决定后续处理程序</text><text class="small" x="498" y="344">例如 6 → TCP，17 → UDP</text><text x="30" y="428">设计取舍：让每个中间节点少做事，而不是让网络层承诺可靠交付。</text><text class="small" x="30" y="456">原创职责图；不表示所有设备内部流水线必须采用这一执行顺序。</text></svg>