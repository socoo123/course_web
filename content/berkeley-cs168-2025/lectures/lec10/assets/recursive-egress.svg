<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-labelledby="title desc"><title id="title">外部目的地到直接下一跳的两级解析</title><desc id="desc">路由器E通过iBGP选择出口G，再通过IGP得到直接下一跳F。实际数据沿E到F到G到外部目的地Z。</desc><style>:root{--ink:#172033;--accent:#176b9a;--soft:#526173}@media(prefers-color-scheme:dark){:root{--ink:#e5edf5;--accent:#7dd3fc;--soft:#b8c5d5}}text{fill:var(--ink,#172033);font-family:system-ui,'PingFang SC',sans-serif;font-size:21px}.small{font-size:17px;fill:var(--soft,#526173)}.box{fill:none;stroke:var(--ink,#172033);stroke-width:2}.route{fill:none;stroke:var(--accent,#176b9a);stroke-width:3;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="var(--accent,#176b9a)"/></marker></defs><text x="32" y="38">控制平面：两个不同的问题</text><rect class="box" x="30" y="60" width="385" height="95" rx="10"/><text x="50" y="94">BGP：外部前缀 Z → 出口 G</text><text class="small" x="50" y="130">eBGP 学到可达性，iBGP 在域内分发</text><rect class="box" x="465" y="60" width="405" height="95" rx="10"/><text x="485" y="94">IGP：去 G → 直接下一跳 F</text><text class="small" x="485" y="130">G 可以隔着多个域内物理跳</text><path class="route" d="M418 108H460"/><text x="32" y="211">数据平面：每一跳只需知道下一步</text><g class="box"><rect x="35" y="240" width="120" height="70" rx="10"/><rect x="255" y="240" width="120" height="70" rx="10"/><rect x="475" y="240" width="120" height="70" rx="10"/><rect x="725" y="240" width="135" height="70" rx="10"/></g><text x="83" y="284">E</text><text x="303" y="284">F</text><text x="523" y="284">G</text><text x="749" y="284">外部 Z</text><path class="route" d="M158 275H248M378 275H468M598 275H718"/><text class="small" x="40" y="357">同一个 AS：E、F、G</text><text class="small" x="624" y="357">跨 AS 互连</text><text class="small" x="32" y="393">概念出口 ≠ BGP NEXT_HOP 属性 ≠ 直接相邻下一跳；真实设备需要递归解析。</text></svg>