<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" role="img" aria-labelledby="title desc"><style>:root{color:var(--diagram-ink,#1f2937)}@media(prefers-color-scheme:dark){:root{color:var(--diagram-ink-dark,#e5e7eb)}}</style><title id="title">拓扑版本一致性与前缀具体性是两个不同问题</title><desc id="desc">左侧三台路由器先传播同一来源的新版本状态，再本地计算路径。右侧默认前缀、10网段和更具体10.2网段嵌套，选择最长匹配。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="currentColor"/></marker></defs><g font-family="sans-serif, PingFang SC, Microsoft YaHei" fill="currentColor"><text x="25" y="35" font-size="22">控制面：同一张图上的局部计算</text><text x="490" y="35" font-size="22">数据面：匹配中选择最长前缀</text><g fill="none" stroke="currentColor" stroke-width="2"><rect x="25" y="85" width="115" height="55" rx="5"/><rect x="180" y="85" width="115" height="55" rx="5"/><rect x="335" y="85" width="115" height="55" rx="5"/><path d="M140 112H180M295 112H335" marker-end="url(#a)"/><rect x="490" y="65" width="405" height="235" rx="8"/><rect x="515" y="115" width="355" height="160" rx="8"/><rect x="540" y="165" width="305" height="85" rx="8"/></g><g font-size="18"><text x="38" y="118">R1：版本 8</text><text x="193" y="118">R2：版本 8</text><text x="348" y="118">R3：版本 8</text><text x="25" y="185">状态身份 = 通告源 + 版本</text><text x="25" y="220">相同副本不无限转发；新版本不能误丢。</text><text x="25" y="255">若新旧图混用，暂态转发仍可能成环。</text><text x="510" y="97">0.0.0.0/0 → 出口 P</text><text x="535" y="147">10.0.0.0/8 → 出口 Q</text><text x="555" y="197">10.2.0.0/16 → 出口 R</text><text x="555" y="230">10.2.3.4 选 R，不选更短前缀。</text></g></g></svg>