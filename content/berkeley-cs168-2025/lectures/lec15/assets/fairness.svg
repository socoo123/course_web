<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 370" role="img" aria-labelledby="title desc"><title id="title">本地公平与端到端反馈</title><desc id="desc">容量十需求八六二得到四四二；排队调度与ECN反馈是不同机制。</desc><style>svg{color:#172033;--accent:#075985;--warn:#a33a14}text{fill:currentColor;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;font-size:18px}.line{stroke:currentColor;stroke-width:2;fill:none}.accent{stroke:var(--accent,#075985);stroke-width:3;fill:none}.box{stroke:currentColor;stroke-width:1.5;fill:none}.small{font-size:15px}@media(prefers-color-scheme:dark){svg{color:#e5e7eb;--accent:#7dd3fc;--warn:#fdba74}}</style><text x="25" y="40">本地出口：容量 10</text><rect class="box" x="25" y="70" width="285" height="55" rx="6"/><text x="40" y="105">A：需求 8 → 服务 4</text><rect class="box" x="25" y="140" width="285" height="55" rx="6"/><text x="40" y="175">B：需求 6 → 服务 4</text><rect class="box" x="25" y="210" width="285" height="55" rx="6"/><text x="40" y="245">C：需求 2 → 服务 2</text><text x="370" y="40">端到端反馈：不是调度</text><rect class="box" x="370" y="70" width="340" height="55" rx="6"/><text x="385" y="105">路由器：队列策略 → 标记</text><path class="accent" d="M540 125V145"/><text x="385" y="175">接收者：回显所见拥塞</text><path class="accent" d="M540 190V210"/><rect class="box" x="370" y="210" width="340" height="55" rx="6"/><text x="385" y="245">发送者：根据反馈调整</text><text class="small" x="25" y="320">本地公平不能知道所有下游瓶颈；标记也不能代替发送端响应</text></svg>
