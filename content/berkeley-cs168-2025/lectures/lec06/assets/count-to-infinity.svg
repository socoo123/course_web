<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc"><style>:root{color:var(--diagram-ink,#1f2937)}@media(prefers-color-scheme:dark){:root{color:var(--diagram-ink-dark,#e5e7eb)}}</style><title id="title">三节点环为什么绕过水平分割</title><desc id="desc">D到C的链路断开。A仍指向C，B改向A，C改向B。广告沿A到B到C到A传播，没有直接回告当前下一跳，距离却持续增加。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="currentColor"/></marker></defs><g font-family="sans-serif, PingFang SC, Microsoft YaHei" fill="currentColor"><text x="25" y="32" font-size="22">没有直接回告下一跳，仍能形成三节点依赖环</text><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="65" cy="180" r="25"/><rect x="170" y="155" width="60" height="50" rx="5"/><rect x="350" y="65" width="60" height="50" rx="5"/><rect x="350" y="245" width="60" height="50" rx="5"/><path d="M90 180H170" stroke-dasharray="5 5"/><path d="M118 167L140 193M140 167L118 193"/><g marker-end="url(#a)"><path d="M350 95L230 165"/><path d="M210 205L350 270"/><path d="M380 245V115"/></g></g><g font-size="23" text-anchor="middle"><text x="65" y="188">D</text><text x="200" y="187">C</text><text x="380" y="98">A</text><text x="380" y="278">B</text></g><g font-size="19"><text x="500" y="90">A → B 通告 2，B 安装 3</text><text x="500" y="130">B → C 通告 3，C 安装 4</text><text x="500" y="170">C → A 通告 4，A 安装 5</text><text x="500" y="210">重复：6、7、8、…</text><text x="500" y="260">有限阈值让“∞”最终可达，</text><text x="500" y="290">但不会使故障瞬间无环。</text><text x="25" y="325">图中实线箭头是数据下一跳；通告方向与之相反。每条链路代价为 1。</text></g></g></svg>