<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" role="img" aria-labelledby="title desc">
  <title id="title">逻辑任务与多个执行尝试</title>
  <desc id="desc">Map 7 分给 A，超时后分给 B。两次执行尝试最终只对应一个已完成的逻辑任务。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#475569"/></marker></defs>
  <rect width="800" height="280" rx="12" fill="#f8fafc"/>
  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" fill="#0f172a">
    <rect x="25" y="102" width="160" height="70" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="105" y="131" font-size="18">逻辑任务 Map 7</text><text x="105" y="155" font-size="14">固定的一份输入</text>
    <rect x="300" y="35" width="190" height="65" rx="10" fill="#fef3c7" stroke="#d97706"/>
    <text x="395" y="62" font-size="18">尝试 A：先领任务</text><text x="395" y="85" font-size="14">停顿后仍可能恢复</text>
    <rect x="300" y="175" width="190" height="65" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="395" y="202" font-size="18">尝试 B：超时重派</text><text x="395" y="225" font-size="14">不增加逻辑任务数</text>
    <rect x="605" y="102" width="170" height="70" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="690" y="131" font-size="18">接受一份完整结果</text><text x="690" y="155" font-size="14">Map 7 只完成一次</text>
  </g>
  <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <path d="M185 120 L285 70"/><path d="M185 155 L285 205"/>
    <path d="M490 70 L592 120"/><path d="M490 205 L592 155"/>
  </g>
</svg>
