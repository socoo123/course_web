<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">RSM 请求路径与四个完成边界</title>
  <desc id="desc">Clerk 经 KV handler 和 Submit 向 Raft 提议；已提交命令在所有副本交给 DoOp，只有配对正确的结果才能返回等待者。Start 返回不等于提交。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#475569"/></marker></defs>
  <rect width="900" height="300" rx="12" fill="#f8fafc"/>
  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <g fill="#e0f2fe" stroke="#0284c7">
      <rect x="24" y="35" width="150" height="60" rx="8"/>
      <rect x="244" y="35" width="180" height="60" rx="8"/>
      <rect x="494" y="35" width="160" height="60" rx="8"/>
      <rect x="724" y="35" width="150" height="60" rx="8"/>
    </g>
    <g fill="#0f172a" font-size="17">
      <text x="99" y="71">Clerk</text><text x="334" y="71">KV handler</text>
      <text x="574" y="71">RSM Submit</text><text x="799" y="71">Raft Start</text>
    </g>
    <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M174 65H240"/><path d="M424 65H490"/><path d="M654 65H720"/>
      <path d="M799 95V190"/><path d="M724 220H658"/><path d="M494 220H428"/>
      <path d="M244 220H99V100"/>
    </g>
    <text x="705" y="124" fill="#b45309" font-size="15">① 接纳提议 ≠ 提交</text>
    <text x="699" y="165" fill="#334155" font-size="15">② 提交后交付 applyCh</text>
    <g fill="#dcfce7" stroke="#16a34a">
      <rect x="724" y="190" width="150" height="60" rx="8"/>
      <rect x="494" y="190" width="160" height="60" rx="8"/>
      <rect x="244" y="190" width="180" height="60" rx="8"/>
    </g>
    <g fill="#0f172a" font-size="17">
      <text x="799" y="226">各副本 reader</text><text x="574" y="226">③ DoOp 应用</text>
      <text x="334" y="226">④ 配对后交还结果</text>
    </g>
    <text x="334" y="280" fill="#475569" font-size="14">结果只交给对应的等待者；无等待者也必须应用日志</text>
  </g>
</svg>
