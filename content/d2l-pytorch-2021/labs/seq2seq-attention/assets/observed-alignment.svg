<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 492" role="img" aria-labelledby="title desc">
<title id="title">真实小训练固定首条验证句的Bahdanau权重</title>
<desc id="desc">ManyThings2026英法包第58行，源句i try点号，参考j’essaye点号。注意力模型贪心输出je suis parti点号再EOS，译错。五行预测词对四列有效源词，后几步集中于源EOS。来自主agent真实训练日志，不是人工对齐。</desc>
