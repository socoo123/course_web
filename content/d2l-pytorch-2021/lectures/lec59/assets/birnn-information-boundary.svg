<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" role="img" aria-labelledby="title desc"><title id="title">未来token通过反向递归影响当前位置预测</title><desc id="desc">输入三个位置，前向状态从左到右，反向状态从右到左。位置t的下一token目标位于输入t加1，红箭头强调其经反向状态进入位置t表示，构成因果生成泄漏。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b91c1c"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172554;font-size:20px} .small{font-size:17px} .box{fill:#eff6ff;stroke:#2563eb;stroke-width:2} .gate{fill:#ecfdf5;stroke:#047857;stroke-width:2} .line{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)} .redline{fill:none;stroke:#b91c1c;stroke-width:3;marker-end:url(#red)} .muted{fill:#475569}</style><rect width="600" height="500" rx="12" fill="#ffffff"/><text x="25" y="38" font-weight="700">预测下一词元时，未来必须不可见</text><text x="30" y="91">输入</text><rect class="box" x="115" y="65" width="110" height="50" rx="8"/><text x="149" y="98">X(t)</text><rect x="285" y="65" width="110" height="50" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text x="301" y="98">X(t+1)</text><rect class="box" x="455" y="65" width="120" height="50" rx="8"/><text x="469" y="98">X(t+2)</text><text x="30" y="179">前向</text><rect class="box" x="115" y="150" width="110" height="50" rx="8"/><text x="149" y="182">F(t)</text><rect class="box" x="285" y="150" width="110" height="50" rx="8"/><text x="303" y="182">F(t+1)</text><rect class="box" x="455" y="150" width="120" height="50" rx="8"/><text x="472" y="182">F(t+2)</text><path class="line" d="M225 175 H280 M395 175 H450 M170 115 V145 M340 115 V145 M515 115 V145"/><text x="30" y="278">反向</text><rect class="box" x="115" y="250" width="110" height="50" rx="8"/><text x="149" y="282">R(t)</text><rect class="box" x="285" y="250" width="110" height="50" rx="8"/><text x="303" y="282">R(t+1)</text><rect class="box" x="455" y="250" width="120" height="50" rx="8"/><text x="472" y="282">R(t+2)</text><path class="line" d="M455 275 H400"/><path class="redline" d="M285 275 H230 M395 90 H425 V225 H340 V245"/><path class="redline" d="M170 300 V350"/><rect x="80" y="356" width="360" height="55" rx="8" fill="#fff7ed" stroke="#b45309"/><text x="102" y="391">位置 t 的表示 → 预测 X(t+1)</text><text class="small" x="30" y="450" fill="#b91c1c">目标已通过反向路径进入输入特征</text><text class="small muted" x="30" y="480">完整输入标注可合法使用；因果生成不可以</text></svg>
