<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" role="img" aria-labelledby="title desc"><title id="title">单图风格迁移的优化对象</title><desc id="desc">内容图和风格图经过固定网络生成缓存目标；合成图经过同一网络，每步求内容、Gram、TV损失，梯度只更新合成图。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" class="arrow"/></marker></defs><style>svg{background:#f8fafc}text{font-family:system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:20px;fill:#172033}.heading{font-size:25px;font-weight:700}rect{fill:#e8f0ff;stroke:#42638f;stroke-width:2}rect.accent{fill:#fff0d6;stroke:#9a5c13}path{fill:none;stroke:#42638f;stroke-width:2.5;marker-end:url(#arrow)}path.arrow{fill:#42638f;stroke:none;marker-end:none}path.back{stroke:#9a5c13;stroke-dasharray:7 4}@media(prefers-color-scheme:dark){svg{background:#111827}text{fill:#edf2ff}rect{fill:#1f3350;stroke:#99b9ed}rect.accent{fill:#45341d;stroke:#e9bc75}path{stroke:#99b9ed}path.arrow{fill:#99b9ed}path.back{stroke:#e9bc75}}</style><text x="35" y="44" class="heading">网络是测量器，图像才是优化变量</text><rect x="35" y="80" width="200" height="80" rx="12"/><text x="55" y="114">内容图 c / 风格图 s</text><text x="55" y="145">固定目标路径</text><rect x="285" y="80" width="200" height="80" rx="12"/><text x="305" y="114">固定 VGG19</text><text x="305" y="145">提取中间特征</text><rect x="535" y="80" width="190" height="80" rx="12"/><text x="552" y="114">缓存内容 / Gram</text><text x="552" y="145">目标不求梯度</text><path d="M240 120 H275"/><path d="M490 120 H525"/><rect x="35" y="230" width="200" height="90" rx="12" class="accent"/><text x="55" y="266">合成图 x</text><text x="55" y="301">唯一被更新的张量</text><rect x="285" y="230" width="200" height="90" rx="12"/><text x="305" y="266">同一个固定网络</text><text x="305" y="301">保留对 x 的梯度</text><rect x="535" y="230" width="190" height="90" rx="12"/><text x="552" y="266">内容 + Gram损失</text><text x="552" y="301">再加图像 TV</text><path d="M240 275 H275"/><path d="M490 275 H525"/><path d="M630 170 V220"/><path d="M630 330 V383 H135 V330" class="back"/><text x="250" y="416">反传经过网络，但优化器只更新 x</text><text x="35" y="455">冻结参数 ≠ 对合成图前向使用 no_grad</text></svg>
