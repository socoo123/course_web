<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 610" role="img" aria-labelledby="title desc">
<title id="title">离散GPU系统中的数据路径</title><desc id="desc">从持久存储到CPU主存，再经主机设备互连到GPU显存与片上单元。容量、各层带宽和计算吞吐不同，统一内存设备的路径可能不同。</desc><style>
svg{color:#16324f;background:#f8fafc} .box{fill:#e8f0fb;stroke:#315b83;stroke-width:2} .accent{fill:#e1f4eb;stroke:#267451;stroke-width:2} .warn{fill:#fff1d6;stroke:#956600;stroke-width:2} text{fill:currentColor;font-family:system-ui,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:20px} .small{font-size:17px} .line{fill:none;stroke:currentColor;stroke-width:2} @media(prefers-color-scheme:dark){svg{color:#e4edf8;background:#101b2b}.box{fill:#203852;stroke:#91b7e1}.accent{fill:#173e35;stroke:#87d4b1}.warn{fill:#44361d;stroke:#e3bd65}}
</style>
<rect class="box" x="80" y="20" width="440" height="65" rx="12"/><text x="300" y="60" text-anchor="middle">持久存储：数据与检查点</text>
<path class="line" d="M300 85v40"/><text class="small" x="320" y="113">读取 / 解码</text>
<rect class="box" x="80" y="125" width="440" height="88" rx="12"/><text x="300" y="159" text-anchor="middle">CPU：主存 ↔ 缓存 ↔ 向量单元</text><text class="small" x="300" y="189" text-anchor="middle">输入准备、控制与CPU计算</text>
<path class="line" d="M300 213v66"/><text class="small" x="320" y="242">主机—设备互连</text><text class="small" x="320" y="264">固定开销 + 字节流量</text>
<rect class="accent" x="80" y="279" width="440" height="80" rx="12"/><text x="300" y="311" text-anchor="middle">设备内存：参数 / 激活 / 状态</text><text class="small" x="300" y="339" text-anchor="middle">容量 ≠ 带宽</text>
<path class="line" d="M300 359v45"/><text class="small" x="320" y="389">设备内部数据访问</text>
<rect class="accent" x="80" y="404" width="440" height="80" rx="12"/><text x="300" y="436" text-anchor="middle">GPU：片上复用 ↔ 并行计算</text><text class="small" x="300" y="465" text-anchor="middle">计算吞吐 ≠ 端到端吞吐</text>
<rect class="warn" x="40" y="520" width="520" height="64" rx="12"/><text class="small" x="300" y="546" text-anchor="middle">先确定瓶颈在何处，再改变算力、流量或调用次数</text><text class="small" x="300" y="571" text-anchor="middle">离散GPU概念图，非实测拓扑或带宽</text>
</svg>
