<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc"><style>text{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172b4d;font-size:20px}.small{font-size:17px}.box{fill:#e8f2ff;stroke:#225d9c;stroke-width:2}.warm{fill:#fff1d6;stroke:#956414;stroke-width:2}.line{fill:none;stroke:#225d9c;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#956414;stroke-width:3;stroke-dasharray:7 5;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#225d9c"/></marker></defs><rect width="720" height="440" rx="16" fill="#f8fbff"/><title id="title">预测起点决定可用信息</title><desc id="desc">一步预测用新到达的真实观测刷新历史，多步预测把自身输出反馈到下一窗口；预测起点后的观测被隔离。</desc><text x="36" y="42">同一个模型，两种可见历史</text><rect class="box" x="35" y="80" width="180" height="65" rx="8"/><text x="55" y="120">已观测历史</text><rect class="box" x="280" y="80" width="140" height="65" rx="8"/><text x="308" y="120">预测器</text><rect class="box" x="485" y="80" width="195" height="65" rx="8"/><text x="507" y="120">下一步预测</text><path class="line" d="M215 112H280 M420 112H485"/><text x="40" y="200">一步：等待真实观测，再刷新窗口</text><rect class="warm" x="35" y="235" width="190" height="65" rx="8"/><text x="55" y="275">固定起点历史</text><rect class="box" x="280" y="235" width="140" height="65" rx="8"/><text x="308" y="275">预测器</text><rect class="warm" x="485" y="235" width="195" height="65" rx="8"/><text x="507" y="275">预测值反馈</text><path class="line" d="M225 267H280 M420 267H485"/><path class="dash" d="M580 300V345H350V300"/><text x="40" y="402">滚动：起点之后不再输入真实未来</text></svg>
