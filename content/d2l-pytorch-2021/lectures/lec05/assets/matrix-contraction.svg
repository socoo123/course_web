<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" role="img" aria-labelledby="title desc">
  <title id="title">矩阵乘法将共同特征轴求和</title>
  <desc id="desc">矩阵X的两行分别是二三和一五，W的两列是四一和零二。X第一行与W第一列做点积得到十一；完整结果为十一六、九十。形状N乘D与D乘K相乘，得到N乘K。</desc>
  <style>@media (prefers-color-scheme: dark) { :root { filter: invert(1); } }</style>
  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="currentColor">
    <text x="24" y="35" font-size="22">一行 × 一列 → 一个输出</text>
    <g font-size="20" text-anchor="middle">
      <text x="140" y="88">X：样本 × 特征</text><text x="407" y="88">W：特征 × 输出</text><text x="690" y="88">Y：样本 × 输出</text>
      <text x="103" y="143">2</text><text x="173" y="143">3</text>
      <text x="103" y="196">1</text><text x="173" y="196">5</text>
      <text x="277" y="171">@</text>
      <text x="372" y="143">4</text><text x="442" y="143">0</text>
      <text x="372" y="196">1</text><text x="442" y="196">2</text>
      <text x="555" y="171">=</text>
      <text x="655" y="143">11</text><text x="725" y="143">6</text>
      <text x="655" y="196">9</text><text x="725" y="196">10</text>
    </g>
    <g fill="none" stroke="var(--border, currentColor)" stroke-width="2">
      <rect x="64" y="111" width="150" height="107" rx="5"/>
      <rect x="332" y="111" width="150" height="107" rx="5"/>
      <rect x="615" y="111" width="150" height="107" rx="5"/>
    </g>
    <g fill="none" stroke="var(--accent, currentColor)" stroke-width="3">
      <rect x="76" y="122" width="125" height="33" rx="5"/>
      <rect x="351" y="122" width="42" height="83" rx="5"/>
      <rect x="632" y="122" width="47" height="33" rx="5"/>
    </g>
    <text x="24" y="272" font-size="22" fill="var(--accent, currentColor)">左上角：2 × 4 + 3 × 1 = 11</text>
    <text x="24" y="314" font-size="21">(N, D) @ (D, K) → (N, K)</text>
    <text x="24" y="353" font-size="17" fill="var(--muted, currentColor)">共同特征维D被求和；不是对应位置相乘，也不是把所有样本加在一起。</text>
  </g>
</svg>
