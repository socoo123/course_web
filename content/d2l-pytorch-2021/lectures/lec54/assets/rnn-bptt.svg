<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc"><style>text{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172b4d;font-size:20px}.small{font-size:17px}.box{fill:#e8f2ff;stroke:#225d9c;stroke-width:2}.warm{fill:#fff1d6;stroke:#956414;stroke-width:2}.line{fill:none;stroke:#225d9c;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#956414;stroke-width:3;stroke-dasharray:7 5;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#225d9c"/></marker></defs><rect width="720" height="440" rx="16" fill="#f8fbff"/><title id="title">RNN共享参数与梯度截断</title><desc id="desc">三个时间步复用同一参数，前向状态经过detach边界仍传递数值，反向梯度在边界停止。</desc><text x="35" y="42">展开计算图，不展开参数集合</text><rect class="warm" x="205" y="70" width="310" height="55" rx="8"/><text x="247" y="105">同一组权重与偏置</text><path class="line" d="M245 125L145 185 M360 125V185 M475 125L580 185"/><rect class="box" x="70" y="185" width="150" height="65" rx="8"/><text x="112" y="225">状态 h₁</text><rect class="box" x="285" y="185" width="150" height="65" rx="8"/><text x="327" y="225">状态 h₂</text><rect class="box" x="510" y="185" width="150" height="65" rx="8"/><text x="550" y="225">状态 h₃</text><path class="line" d="M220 217H285 M435 217H510"/><path d="M472 160V350" stroke="#956414" stroke-width="3" stroke-dasharray="7 5"/><text class="small" x="490" y="285">detach边界</text><path class="dash" d="M580 315H490 M360 315H145"/><text class="small" x="80" y="352">反向沿图返回；共享参数汇总贡献</text><text x="65" y="408">保留状态数值 ≠ 保留全部历史梯度</text></svg>
