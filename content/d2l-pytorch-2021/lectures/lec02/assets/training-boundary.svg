<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="title desc">
  <title id="title">数据、模型、损失与优化的职责及评估边界</title>
  <desc id="desc">训练时距离特征输入模型，预测与标签计算损失，优化算法据此更新参数。独立评估使用未参与拟合的数据，不将最终测试结果返回参数更新环。</desc>
  <style>
    :root { --accent: currentColor; --border: currentColor; --muted: currentColor; }
    @media (prefers-color-scheme: dark) { :root { filter: invert(1); } }
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="var(--accent)"/></marker></defs>
  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="currentColor" text-anchor="middle">
    <text x="440" y="32" font-size="22">训练：用经验选择参数，而非改写标签</text>
    <g stroke="var(--border)" stroke-width="2" fill="none"><rect x="25" y="75" width="175" height="90" rx="8"/><rect x="260" y="75" width="180" height="90" rx="8"/><rect x="500" y="75" width="155" height="90" rx="8"/><rect x="710" y="75" width="145" height="90" rx="8"/></g>
    <text x="112" y="110" font-size="20">训练样本</text><text x="112" y="142" font-size="16">(1, 3)、(2, 5)</text>
    <text x="350" y="110" font-size="20">模型：ŷ = wx + b</text><text x="350" y="142" font-size="16">w、b 决定预测</text>
    <text x="577" y="110" font-size="20">损失</text><text x="577" y="142" font-size="16">预测与标签比较</text>
    <text x="782" y="110" font-size="20">优化算法</text><text x="782" y="142" font-size="16">决定如何更新</text>
    <g fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow)"><path d="M200 105 H253"/><path d="M440 105 H493"/><path d="M655 120 H703"/><path d="M112 165 V202 H577 V172"/><path d="M782 165 V247 H350 V172"/></g>
    <text x="227" y="89" font-size="15">x</text><text x="468" y="89" font-size="15">ŷ</text><text x="214" y="194" font-size="15">真实标签 y</text>
    <text x="555" y="238" font-size="16">更新参数 w、b</text>
    <path d="M25 278 H855" stroke="var(--border)" stroke-dasharray="7 5"/>
    <text x="440" y="310" font-size="20">独立评估：新样本 → 固定模型 → 评价误差</text>
    <text x="440" y="348" font-size="18">新样本 (3, 7)：线性规则预测 7；只记忆旧样本的规则可能预测 0</text>
    <text x="440" y="390" font-size="16" fill="var(--muted)">最终测试不用于反复挑选方案；两条训练数据拟合完美，不代表部署可靠</text>
  </g>
</svg>
