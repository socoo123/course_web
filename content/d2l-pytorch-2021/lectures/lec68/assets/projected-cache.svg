<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 690" role="img" aria-labelledby="title desc"><title id="title">每层每候选的投影KV缓存</title><desc id="desc">旧缓存长度p决定新token位置。当前层只追加新K和V，当前Q读取拼接后的缓存。父候选重排必须应用于所有层的K与V以及位置状态。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs><rect width="560" height="690" rx="16" fill="#f8fafc"/><g font-family="sans-serif" fill="#172554" text-anchor="middle"><text x="280" y="36" font-size="23" font-weight="bold">层 ℓ、候选 b：状态不能串线</text><rect x="40" y="60" width="480" height="85" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="280" y="92" font-size="21">新 token 位置 = 旧缓存长度 p</text><text x="280" y="125" font-size="20">当前层输入 x → q / k / v</text><path d="M280 145V180" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="184" width="480" height="121" rx="12" fill="#dcfce7" stroke="#15803d"/><text x="280" y="217" font-size="21">K旧 [0 … p−1] + k新 [p]</text><text x="280" y="251" font-size="21">V旧 [0 … p−1] + v新 [p]</text><text x="280" y="282" font-size="18">形状 (B, h, p+1, d/h)</text><path d="M280 305V340" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="344" width="480" height="85" rx="12" fill="#e0e7ff" stroke="#4338ca"/><text x="280" y="378" font-size="21">q新读取本层前缀 K/V</text><text x="280" y="410" font-size="19">后续子层 → 下一层；不复用别层缓存</text><rect x="40" y="464" width="480" height="187" rx="12" fill="#fef3c7" stroke="#b45309"/><text x="280" y="498" font-size="22" font-weight="bold">beam 父候选：[2, 0, 2]</text><text x="280" y="534" font-size="20">所有层 K / V 都按此重排</text><text x="280" y="569" font-size="20">位置、长度与源身份保持对应</text><text x="280" y="604" font-size="19">两个父2分支：相同前缀，不同未来</text><text x="280" y="634" font-size="18">不得共享会被彼此修改的尾部</text></g></svg>
