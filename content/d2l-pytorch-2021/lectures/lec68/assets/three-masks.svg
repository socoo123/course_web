<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 800" role="img" aria-labelledby="title desc"><title id="title">Transformer三个mask边界</title><desc id="desc">源编码器屏蔽源padding；目标自注意力同时屏蔽未来和目标padding；交叉注意力再次屏蔽源padding。各子层后均有残差与按特征LayerNorm。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs><rect width="560" height="800" rx="16" fill="#f8fafc"/><g font-family="sans-serif" fill="#172554" text-anchor="middle"><text x="280" y="35" font-size="23" font-weight="bold">三个键可见性边界</text><rect x="45" y="58" width="470" height="185" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="280" y="90" font-size="21">源 token → embedding + 位置</text><text x="280" y="127" font-size="20">encoder self：只屏蔽源 PAD</text><text x="280" y="161" font-size="20">AddNorm → FFN → AddNorm</text><text x="280" y="197" font-size="20">重复 L 层 → 编码记忆 M</text><text x="280" y="226" font-size="18">源有效长度 3 / 宽 4：键 1 1 1 0</text><path d="M495 243V513H463" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="481" y="287" font-size="17">K/V</text><rect x="45" y="307" width="420" height="152" rx="12" fill="#dcfce7" stroke="#15803d"/><text x="255" y="338" font-size="21">目标右移 → embedding + 位置</text><text x="255" y="374" font-size="20">decoder self：causal ∩ 目标有效键</text><text x="255" y="410" font-size="19">有效三行：1000 / 1100 / 1110</text><text x="255" y="443" font-size="19">AddNorm：只沿最后 d 维</text><path d="M255 459V487" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="491" width="420" height="96" rx="12" fill="#fef3c7" stroke="#b45309"/><text x="255" y="523" font-size="21">cross：Q来自目标，K/V来自 M</text><text x="255" y="555" font-size="19">仍屏蔽源 PAD → AddNorm</text><path d="M255 587V617" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="621" width="420" height="132" rx="12" fill="#e0e7ff" stroke="#4338ca"/><text x="255" y="654" font-size="21">FFN → AddNorm</text><text x="255" y="690" font-size="20">重复 L 层 → 词表 logits</text><text x="255" y="726" font-size="19">损失只统计有效目标，包含 EOS</text><text x="280" y="782" font-size="17">1 = 允许，0 = 禁止；并非训练观测热图</text></g></svg>
