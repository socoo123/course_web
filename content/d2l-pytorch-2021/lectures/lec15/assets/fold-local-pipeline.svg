<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 550" role="img" aria-labelledby="title desc">
  <title id="title">每折独立拟合预处理，不让验证输入回流</title>
  <desc id="desc">训练折提供均值尺度和类别词表，也训练新建模型。验证折只使用固定状态进行变换并评估。示例训练值1和3得到均值2尺度1，验证101变换为99。选完配置才用全部训练数据重新拟合，最终测试不参与选择。</desc>
  <style>:root { color: #1f2937; } @media (prefers-color-scheme: dark) { :root { filter: invert(1); } }</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <g font-family="system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="currentColor" font-size="19">
    <text x="25" y="35" font-size="24" font-weight="700">先划分，再 fit；每一折从头开始</text>
    <g fill="none" stroke="currentColor" stroke-width="2">
      <rect x="25" y="75" width="200" height="100" rx="9"/>
      <rect x="325" y="75" width="225" height="100" rx="9"/>
      <rect x="650" y="75" width="205" height="100" rx="9"/>
      <path d="M225 125 H315 M550 125 H640" marker-end="url(#arrow)"/>
      <rect x="25" y="275" width="200" height="100" rx="9"/>
      <rect x="325" y="275" width="225" height="100" rx="9"/>
      <rect x="650" y="275" width="205" height="100" rx="9"/>
      <path d="M225 325 H315 M550 325 H640" marker-end="url(#arrow)"/>
      <path d="M435 175 V265 M750 175 V265" marker-end="url(#arrow)"/>
      <path d="M25 230 H855" stroke-dasharray="8 6"/>
      <path d="M25 430 H855"/>
    </g>
    <text x="45" y="110" font-weight="700">训练折 T</text><text x="45" y="145">数值：[1, 3]</text>
    <text x="345" y="110" font-weight="700">fit 预处理状态</text><text x="345" y="145">均值 2，尺度 1</text>
    <text x="670" y="110" font-weight="700">新模型 / 优化器</text><text x="670" y="145">仅用训练折更新</text>
    <text x="238" y="110" font-size="16">统计</text><text x="560" y="110" font-size="16">训练</text>
    <text x="445" y="210" font-size="17">只向下应用</text><text x="27" y="253" font-size="17">验证边界：禁止向上 fit</text>
    <text x="45" y="310" font-weight="700">验证折 V</text><text x="45" y="345">数值：[101]</text>
    <text x="345" y="310" font-weight="700">transform</text><text x="345" y="345">(101 − 2) / 1 = 99</text>
    <text x="670" y="310" font-weight="700">固定模型评估</text><text x="670" y="345">保存折外预测</text>
    <text x="27" y="403">验证标签只算分数，不更新网络，也不决定预处理统计量。</text>
    <text x="27" y="466" font-weight="700">选定配置后：全部训练数据重新 fit + 训练</text>
    <text x="27" y="501">官方测试：只 transform + 预测，不用它反复选择模型</text>
    <text x="27" y="533" font-size="16">编者自拟示例；尺度采用总体标准差，不是课堂截图或实测成绩。</text>
  </g>
</svg>
