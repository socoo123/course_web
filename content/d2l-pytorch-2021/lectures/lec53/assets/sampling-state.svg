<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc"><style>text{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172b4d;font-size:20px}.small{font-size:17px}.box{fill:#e8f2ff;stroke:#225d9c;stroke-width:2}.warm{fill:#fff1d6;stroke:#956414;stroke-width:2}.line{fill:none;stroke:#225d9c;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#956414;stroke-width:3;stroke-dasharray:7 5;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#225d9c"/></marker></defs><rect width="720" height="440" rx="16" fill="#f8fbff"/><title id="title">状态能否沿批次延续</title><desc id="desc">顺序分区保持每行同一数据流并在边界detach；随机子序列各自重置状态，不相互传递。</desc><text x="35" y="42">连续的是行身份，不是批号</text><text x="40" y="85">顺序分区</text><rect class="box" x="55" y="110" width="210" height="55" rx="8"/><text x="87" y="145">流A · 前块</text><rect class="box" x="450" y="110" width="210" height="55" rx="8"/><text x="482" y="145">流A · 后块</text><rect class="box" x="55" y="190" width="210" height="55" rx="8"/><text x="87" y="225">流B · 前块</text><rect class="box" x="450" y="190" width="210" height="55" rx="8"/><text x="482" y="225">流B · 后块</text><path class="line" d="M265 138H450 M265 218H450"/><text class="small" x="300" y="127">数值传递</text><text class="small" x="300" y="207">边界detach</text><text x="40" y="293">随机采样</text><rect class="warm" x="55" y="320" width="265" height="60" rx="8"/><text x="80" y="358">任意子序列 · 重置</text><rect class="warm" x="395" y="320" width="265" height="60" rx="8"/><text x="420" y="358">另一子序列 · 重置</text><text class="small" x="165" y="417">子序列内部依然按时间顺序读取</text></svg>
