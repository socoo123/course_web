<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" role="img" aria-labelledby="title desc"><title id="title">GRU候选分支的reset顺序</title><desc id="desc">教材先对旧状态逐元素门控再用循环矩阵混合。PyTorch先循环仿射再门控，矩阵混合与逐元素门控通常不能交换。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b91c1c"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172554;font-size:20px} .small{font-size:17px} .box{fill:#eff6ff;stroke:#2563eb;stroke-width:2} .gate{fill:#ecfdf5;stroke:#047857;stroke-width:2} .line{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)} .redline{fill:none;stroke:#b91c1c;stroke-width:3;marker-end:url(#red)} .muted{fill:#475569}</style><rect width="600" height="500" rx="12" fill="#ffffff"/><text x="25" y="38" font-weight="700">同一个 reset，作用坐标不同</text><text x="25" y="85">教材：reset-before</text><rect class="box" x="25" y="110" width="100" height="58" rx="9"/><text x="50" y="147">旧 H</text><path class="line" d="M125 139 H175"/><rect class="gate" x="180" y="110" width="130" height="58" rx="9"/><text x="200" y="147">逐元素 × R</text><path class="line" d="M310 139 H365"/><rect class="box" x="370" y="110" width="200" height="58" rx="9"/><text x="390" y="147">循环矩阵混合</text><text class="small muted" x="25" y="204">先选择旧状态坐标，再混合成候选坐标</text><path d="M25 234 H575" stroke="#cbd5e1"/><text x="25" y="277">PyTorch：reset-after</text><rect class="box" x="25" y="305" width="100" height="58" rx="9"/><text x="50" y="342">旧 H</text><path class="line" d="M125 334 H175"/><rect class="box" x="180" y="305" width="200" height="58" rx="9"/><text x="199" y="331">循环矩阵混合</text><text class="small" x="218" y="353">及循环 bias</text><path class="line" d="M380 334 H425"/><rect class="gate" x="430" y="305" width="145" height="58" rx="9"/><text x="445" y="342">逐元素 × R</text><text class="small muted" x="25" y="399">先混合，再选择候选坐标</text><rect x="25" y="429" width="550" height="48" rx="8" fill="#fffbeb"/><text x="44" y="460">只转置权重，不足以保证一般同权等价</text></svg>
