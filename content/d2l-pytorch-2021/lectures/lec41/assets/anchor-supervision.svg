<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
<title id="title">锚框训练匹配与推理去重的信息边界</title>
<desc id="desc">同一组预设锚框在训练中与真实框比较IoU，形成分类目标和回归mask；推理中接收模型预测偏移和分数，解码后执行NMS。真实框不进入推理路径。</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#475569"/></marker></defs>
<rect width="900" height="700" rx="14" fill="#f8fafc"/>
<g font-family="system-ui, 'Noto Sans SC', sans-serif" fill="#0f172a">
<text x="30" y="40" font-size="25" font-weight="700">同一锚框，两种阶段，不同信息</text>
<rect x="300" y="66" width="300" height="60" rx="10" fill="#e2e8f0" stroke="#475569"/>
<text x="355" y="103" font-size="21">预设几何模板 (1,A,4)</text>
<path d="M350 126 V151 H225 V178 M550 126 V151 H675 V178" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="30" y="178" width="390" height="470" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<rect x="480" y="178" width="390" height="470" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="57" y="213" font-size="23" font-weight="700" fill="#1e40af">训练：构造监督</text>
<text x="507" y="213" font-size="23" font-weight="700" fill="#9a3412">推理：整理预测</text>
<rect x="65" y="240" width="320" height="112" fill="#fff" stroke="#94a3b8"/>
<rect x="85" y="265" width="90" height="60" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 3"/>
<rect x="110" y="255" width="95" height="73" fill="#dcfce7" fill-opacity="0.6" stroke="#166534" stroke-width="3"/>
<text x="225" y="278" font-size="17" fill="#166534">实线：真实框</text>
<text x="225" y="310" font-size="17" fill="#1e40af">虚线：锚框</text>
<path d="M225 355 V388" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<text x="68" y="419" font-size="20">IoU 匹配 + 强制覆盖真实框</text>
<text x="68" y="451" font-size="18">正类 → 类别加 1，四项 mask=1</text>
<text x="68" y="482" font-size="18">背景 → 类别 0，四项 mask=0</text>
<path d="M225 498 V532" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<text x="67" y="562" font-size="19">分类损失：正类与背景都参加</text>
<text x="67" y="594" font-size="19">框回归损失：只计正类</text>
<text x="515" y="266" font-size="20">模型给出偏移与前景分数</text>
<path d="M675 279 V310" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<text x="515" y="342" font-size="20">逆变换 → 预测框</text>
<rect x="515" y="368" width="320" height="115" fill="#fff" stroke="#94a3b8"/>
<rect x="537" y="389" width="87" height="65" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/>
<rect x="555" y="399" width="90" height="65" fill="none" stroke="#64748b" stroke-dasharray="5 3" stroke-width="2"/>
<text x="665" y="406" font-size="18">保留高分候选</text><text x="665" y="441" font-size="18">抑制重叠低分</text>
<path d="M675 487 V524" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<text x="515" y="553" font-size="19">NMS 不读取真实框</text>
<text x="515" y="585" font-size="18">教材 helper 不按类别分组</text>
<text x="515" y="616" font-size="18">不是融合坐标，也不是评估指标</text>
<text x="220" y="680" font-size="18" fill="#475569">编者示意：两条路径都不能把无效框当正常几何量</text>
</g></svg>
