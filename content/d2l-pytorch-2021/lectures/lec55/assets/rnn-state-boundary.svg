<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" role="img" aria-labelledby="title desc"><title id="title">数值记忆继续，梯度在窗口边界截断</title><desc id="desc">连续窗口保持同一行序列身份，状态通过detach保留数值但不把新窗口梯度传回旧窗口。随机窗口则另起零状态。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b91c1c"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172554;font-size:20px} .small{font-size:17px} .box{fill:#eff6ff;stroke:#2563eb;stroke-width:2} .gate{fill:#ecfdf5;stroke:#047857;stroke-width:2} .line{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)} .redline{fill:none;stroke:#b91c1c;stroke-width:3;marker-end:url(#red)} .muted{fill:#475569}</style><rect width="600" height="500" rx="12" fill="#ffffff"/><text x="30" y="38" font-weight="700">同一行连续流：状态不是计算图</text><rect class="box" x="30" y="80" width="220" height="95" rx="12"/><text x="60" y="116">前一个窗口</text><text class="small" x="60" y="147">自己的时间递推</text><rect class="box" x="350" y="80" width="220" height="95" rx="12"/><text x="380" y="116">后一个窗口</text><text class="small" x="380" y="147">自己的时间递推</text><path class="line" d="M250 125 H347"/><text class="small" x="267" y="100">状态值</text><path d="M300 65 V250" stroke="#b45309" stroke-width="3" stroke-dasharray="7 6"/><rect x="225" y="195" width="150" height="42" rx="8" fill="#fffbeb" stroke="#b45309"/><text x="250" y="223">detach</text><text x="30" y="282">保留数值 ≠ 保留旧图</text><text x="30" y="318">清参数梯度 ≠ 清状态</text><path d="M30 346 H570" stroke="#cbd5e1"/><text x="30" y="385" font-weight="700">若换成独立随机窗口</text><rect class="gate" x="30" y="411" width="160" height="56" rx="10"/><text x="55" y="446">重新初始化</text><path class="line" d="M190 439 H280"/><text x="300" y="446">不能携带别人的前文</text></svg>
