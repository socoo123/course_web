<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" role="img" aria-labelledby="title desc"><title id="title">牛仔行头历史竞赛身份与执行合同</title><desc id="desc">官方公告绑定启动视频和CodaLab结果；Kaggle公开页面回链同一CodaLab编号。学习路线需核数据条件后才能训练，不能把机制检查当竞赛复现。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" class="arrow"/></marker></defs><style>svg{background:#f8fafc}text{font-family:system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:20px;fill:#172033}.heading{font-size:25px;font-weight:700}rect{fill:#e8f0ff;stroke:#42638f;stroke-width:2}rect.accent{fill:#fff0d6;stroke:#9a5c13}path{fill:none;stroke:#42638f;stroke-width:2.5;marker-end:url(#arrow)}path.arrow{fill:#42638f;stroke:none;marker-end:none}path.back{stroke:#9a5c13;stroke-dasharray:7 4}@media(prefers-color-scheme:dark){svg{background:#111827}text{fill:#edf2ff}rect{fill:#1f3350;stroke:#99b9ed}rect.accent{fill:#45341d;stroke:#e9bc75}path{stroke:#99b9ed}path.arrow{fill:#99b9ed}path.back{stroke:#e9bc75}}</style><text x="35" y="44" class="heading">先绑定身份，再区分能做到哪一层</text><rect x="35" y="75" width="315" height="85" rx="12"/><text x="55" y="110">官方公告第十八周</text><text x="55" y="143">牛仔行头 → 官方启动BV</text><rect x="410" y="75" width="315" height="85" rx="12"/><text x="430" y="110">官方结束公告</text><text x="430" y="143">CodaLab 33573</text><rect x="205" y="205" width="350" height="85" rx="12"/><text x="225" y="240">Kaggle cowboyoutfits</text><text x="225" y="273">提交入口回链同一 CodaLab</text><path d="M567 170 V190 H490 V200"/><rect x="35" y="340" width="210" height="90" rx="12"/><text x="55" y="375">① 合成机制检查</text><text x="55" y="410">不等于真实训练</text><rect x="275" y="340" width="210" height="90" rx="12"/><text x="295" y="375">② 合规真实小训练</text><text x="295" y="410">不等于历史复现</text><rect x="515" y="340" width="210" height="90" rx="12" class="accent"/><text x="535" y="375">③ 原竞赛复现</text><text x="535" y="410">需原数据与评估契约</text><text x="35" y="463">历史奖品 / 截止日期，不是今天的课程通过要求</text></svg>
