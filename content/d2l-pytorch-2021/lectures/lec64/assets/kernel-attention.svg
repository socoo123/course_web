<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc"><title id="title">查询驱动的核回归</title><desc id="desc">查询与键计算距离，softmax生成权重，权重与配对的值汇聚。可学习带宽只作用于距离评分，不直接改标签。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172554;font-size:20px}.small{font-size:17px}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.gate{fill:#ecfdf5;stroke:#047857;stroke-width:2}.warn{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.line{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#a)}@media(prefers-color-scheme:dark){text{fill:#e2e8f0}.box{fill:#172554;stroke:#93c5fd}.gate{fill:#052e2b;stroke:#6ee7b7}.warn{fill:#431407;stroke:#fdba74}.line{stroke:#cbd5e1}}</style><text x="30" y="35">Q决定当前问题，K与V逐项配对</text><rect class="box" x="30" y="65" width="240" height="80" rx="12"/><text x="50" y="98">查询 x</text><text class="small" x="50" y="126">现在要预测的输入</text><rect class="box" x="330" y="65" width="240" height="80" rx="12"/><text x="350" y="98">键 x₁, …, xₙ</text><text class="small" x="350" y="126">训练输入，不是标签</text><path class="line" d="M150 145 V185 H270 V205"/><path class="line" d="M450 145 V185 H330 V205"/><rect class="box" x="100" y="210" width="400" height="80" rx="12"/><text x="130" y="244">距离评分：− w²(x − xᵢ)² / 2</text><text class="small" x="130" y="273">|w|越大，越偏向邻近的键</text><path class="line" d="M300 290 V330"/><rect class="gate" x="100" y="335" width="400" height="65" rx="12"/><text x="135" y="374">按键轴 softmax → 权重 αᵢ</text><path class="line" d="M300 400 V460"/><rect class="box" x="30" y="430" width="190" height="65" rx="12"/><text x="50" y="469">值 y₁, …, yₙ</text><path class="line" d="M220 463 H260"/><rect class="gate" x="265" y="465" width="305" height="70" rx="12"/><text x="288" y="506">加权汇聚 → 预测 ŷ</text><text class="small" x="30" y="574">机制示意，非训练曲线；键值换序必须同步。</text></svg>
