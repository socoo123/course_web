<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" role="img" aria-labelledby="title desc"><title id="title">LSTM的cell保留通路和hidden读出</title><desc id="desc">旧cell经过遗忘门并与输入门控制的候选相加成为新cell。新cell经tanh和输出门形成hidden。所有门由当前输入与旧hidden计算。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b91c1c"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172554;font-size:20px} .small{font-size:17px} .box{fill:#eff6ff;stroke:#2563eb;stroke-width:2} .gate{fill:#ecfdf5;stroke:#047857;stroke-width:2} .line{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)} .redline{fill:none;stroke:#b91c1c;stroke-width:3;marker-end:url(#red)} .muted{fill:#475569}</style><rect width="600" height="500" rx="12" fill="#ffffff"/><text x="25" y="38" font-weight="700">记忆 C 与对外状态 H 分开</text><text x="25" y="100">旧 C</text><path class="line" d="M80 93 H132"/><rect class="gate" x="138" y="66" width="110" height="55" rx="8"/><text x="160" y="101">× 遗忘门</text><path class="line" d="M248 93 H320"/><circle cx="344" cy="93" r="25" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="335" y="101">+</text><path class="line" d="M369 93 H480"/><text x="495" y="101">新 C</text><rect class="gate" x="244" y="176" width="200" height="58" rx="9"/><text x="266" y="212">输入门 × 候选</text><path class="line" d="M344 176 V121"/><path class="line" d="M480 93 V278 H366"/><rect class="box" x="244" y="252" width="116" height="54" rx="9"/><text x="273" y="287">tanh</text><path class="line" d="M302 306 V344"/><rect class="gate" x="220" y="350" width="165" height="52" rx="9"/><text x="244" y="383">× 输出门</text><path class="line" d="M385 376 H476"/><text x="492" y="383">新 H</text><rect x="25" y="439" width="550" height="46" rx="8" fill="#f1f5f9"/><text class="small" x="43" y="469">控制输入：当前 X 与旧 H → 三个门、候选</text></svg>
