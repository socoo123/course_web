<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" role="img" aria-labelledby="title desc">
  <title id="title">广播与保留归约轴</title>
  <desc id="desc">形状为二乘一的列向量十、二十，与一乘三的行向量一、二、三相加，得到二乘三矩阵。每行求和并保留轴后得到二乘一的三十六、六十六，可以再向各列广播。</desc>
  <style>@media (prefers-color-scheme: dark) { :root { filter: invert(1); } }</style>
  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="currentColor">
    <text x="24" y="32" font-size="21">广播：从右端对齐，长度1的轴可扩展</text>
    <g font-size="19" text-anchor="middle">
      <text x="85" y="85">(2, 1)</text><text x="250" y="85">(1, 3)</text><text x="559" y="85">(2, 3)</text>
      <text x="85" y="130">10</text><text x="85" y="176">20</text><text x="150" y="153">+</text>
      <text x="200" y="153">1</text><text x="250" y="153">2</text><text x="300" y="153">3</text><text x="391" y="153">→</text>
      <text x="490" y="130">11</text><text x="560" y="130">12</text><text x="630" y="130">13</text>
      <text x="490" y="176">21</text><text x="560" y="176">22</text><text x="630" y="176">23</text>
    </g>
    <g fill="none" stroke="var(--accent, currentColor)" stroke-width="2">
      <rect x="53" y="102" width="64" height="92" rx="6"/>
      <rect x="173" y="125" width="154" height="47" rx="6"/>
      <rect x="451" y="102" width="216" height="92" rx="6"/>
      <path d="M683 115 L753 115 L753 235 L683 235"/>
    </g>
    <text x="24" y="245" font-size="20">归约：列轴压缩为1，行轴还在</text>
    <text x="24" y="282" font-size="17">sum(dim=1, keepdim=True)</text>
    <text x="455" y="245" font-size="18">(2, 1)</text>
    <text x="488" y="282" font-size="19" text-anchor="middle">36</text>
    <text x="488" y="316" font-size="19" text-anchor="middle">66</text>
    <text x="24" y="355" font-size="17" fill="var(--muted, currentColor)">再除回原矩阵时，每行使用自己的分母；没有复制存储的承诺。</text>
  </g>
</svg>
