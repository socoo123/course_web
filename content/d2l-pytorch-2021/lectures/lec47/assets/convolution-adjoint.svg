<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" role="img" aria-labelledby="title desc"><title id="title">卷积的线性伴随不是逆</title><desc id="desc">普通卷积将三维输入映射到二维输出；转置算子沿反向连接累加，满足内积恒等式但不能恢复原值。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" class="arrow"/></marker></defs><style>svg{background:#f8fafc}text{font-family:system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:20px;fill:#172033}.heading{font-size:25px;font-weight:700}rect{fill:#e8f0ff;stroke:#42638f;stroke-width:2}rect.accent{fill:#fff0d6;stroke:#9a5c13}path{fill:none;stroke:#42638f;stroke-width:2.5;marker-end:url(#arrow)}path.arrow{fill:#42638f;stroke:none;marker-end:none}path.back{stroke:#9a5c13;stroke-dasharray:7 4}@media(prefers-color-scheme:dark){svg{background:#111827}text{fill:#edf2ff}rect{fill:#1f3350;stroke:#99b9ed}rect.accent{fill:#45341d;stroke:#e9bc75}path{stroke:#99b9ed}path.arrow{fill:#99b9ed}path.back{stroke:#e9bc75}}</style><text x="40" y="48" class="heading">同一组连接：读入求和 ↔ 散布累加</text><rect x="40" y="90" width="245" height="110" rx="12"/><text x="62" y="127">输入空间 R³</text><text x="62" y="166">x = (1, 2, 3)</text><rect x="475" y="90" width="245" height="110" rx="12"/><text x="497" y="127">输出空间 R²</text><text x="497" y="166">Wx = (5, 8)</text><path d="M300 143 H455"/><text x="330" y="121">W</text><rect x="40" y="260" width="245" height="110" rx="12"/><text x="62" y="297">Wᵀv = (4, 13, 10)</text><text x="62" y="336">重叠处：8 + 5</text><rect x="475" y="260" width="245" height="110" rx="12"/><text x="497" y="297">v = (4, 5)</text><text x="497" y="336">输出空间上的向量</text><path d="M460 315 H305"/><text x="330" y="292">Wᵀ</text><text x="50" y="416">内积两路都等于 60</text><text x="50" y="452">但 WᵀWx = (5, 18, 16) ≠ x</text></svg>
