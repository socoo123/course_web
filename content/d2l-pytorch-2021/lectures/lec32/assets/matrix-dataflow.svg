<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 550" role="img" aria-labelledby="title desc">
<title id="title">抽象二维乘加阵列中的局部复用</title><desc id="desc">A的片段向右传递，B的片段向下传递，四个乘加单元分别累加C的四个位置。图省略错时输入、填充排空与具体周期，不是商用芯片结构。</desc><style>
