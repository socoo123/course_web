<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" role="img" aria-labelledby="title desc"><title id="title">深层循环网络的层与时间两轴</title><desc id="desc">两层三个时间位置的网格，横向是同层状态递推，纵向是同一步层间输出。dropout仅标在层间箭头，顶层输出向分类头。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b91c1c"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172554;font-size:20px} .small{font-size:17px} .box{fill:#eff6ff;stroke:#2563eb;stroke-width:2} .gate{fill:#ecfdf5;stroke:#047857;stroke-width:2} .line{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)} .redline{fill:none;stroke:#b91c1c;stroke-width:3;marker-end:url(#red)} .muted{fill:#475569}</style><rect width="600" height="500" rx="12" fill="#ffffff"/><text x="25" y="38" font-weight="700">层不同参数，时间共享参数</text><text x="32" y="105">第2层</text><text x="32" y="285">第1层</text><path class="line" d="M20 350 V130"/><text class="small" x="25" y="385">层轴 ↑</text><rect class="box" x="130" y="75" width="110" height="58" rx="8"/><text x="145" y="112">H₂(t−1)</text><rect class="box" x="290" y="75" width="110" height="58" rx="8"/><text x="318" y="112">H₂(t)</text><rect class="box" x="450" y="75" width="125" height="58" rx="8"/><text x="464" y="112">H₂(t+1)</text><path class="line" d="M240 104 H285 M400 104 H445"/><rect class="box" x="130" y="255" width="110" height="58" rx="8"/><text x="145" y="292">H₁(t−1)</text><rect class="box" x="290" y="255" width="110" height="58" rx="8"/><text x="318" y="292">H₁(t)</text><rect class="box" x="450" y="255" width="125" height="58" rx="8"/><text x="464" y="292">H₁(t+1)</text><path class="line" d="M240 284 H285 M400 284 H445"/><path class="line" d="M185 255 V138 M345 255 V138 M512 255 V138"/><rect x="122" y="171" width="460" height="42" rx="8" fill="#ecfdf5" stroke="#047857"/><text x="144" y="199">层间 dropout：不直接切时间递归边</text><text x="157" y="359">X(t−1)</text><text x="321" y="359">X(t)</text><text x="480" y="359">X(t+1)</text><path class="line" d="M185 339 V318 M345 339 V318 M512 339 V318"/><path class="line" d="M130 400 H570"/><text x="300" y="432">时间轴 →</text><text class="small muted" x="25" y="478">LSTM：每格另有自己的 C，沿同层时间轴传递</text></svg>
