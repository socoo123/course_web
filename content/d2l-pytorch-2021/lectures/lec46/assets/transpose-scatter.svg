<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="title desc">
<title id="title">一维转置卷积的散布与重叠相加</title>
<desc id="desc">输入1和2乘同一个核1、3。步幅1时贡献为1、3、0与0、2、6，相加得到1、5、6；步幅2时不重叠，得到1、3、2、6。步幅控制输出散布起点间距。</desc>
<style>svg{background:#f8fafc;color:#172033;font-family:Arial,"Noto Sans SC","PingFang SC",sans-serif}text{fill:currentColor;font-size:20px}.head{font-size:24px;font-weight:700}.small{font-size:17px}.box{fill:#e0f2fe;stroke:#0369a1;stroke-width:2}.sum{fill:#dcfce7;stroke:#15803d;stroke-width:2}.line{fill:none;stroke:#475569;stroke-width:2}@media(prefers-color-scheme:dark){svg{background:#111827;color:#f1f5f9}.box{fill:#15324b;stroke:#7dd3fc}.sum{fill:#163d2a;stroke:#86efac}.line{stroke:#cbd5e1}}</style>
<text x="25" y="37" class="head">输入 [1, 2]，核 [1, 3]：输出是贡献之和</text>
<rect class="box" x="25" y="66" width="360" height="300" rx="12"/>
<rect class="box" x="410" y="66" width="365" height="300" rx="12"/>
<text x="46" y="100">stride = 1，起点间隔1</text>
<text x="431" y="100">stride = 2，起点间隔2</text>
<text x="46" y="153" class="small">1 × 核</text><text x="164" y="153">1　3　0</text>
<text x="46" y="201" class="small">2 × 核</text><text x="164" y="201">0　2　6</text>
<path class="line" d="M150 223 H346"/>
<rect class="sum" x="143" y="244" width="207" height="52" rx="8"/>
<text x="46" y="277">相加</text><text x="164" y="277">1　5　6</text>
<text x="46" y="337" class="small">中间是 3 + 2，不是覆盖或平均</text>
<text x="431" y="153" class="small">1 × 核</text><text x="544" y="153">1　3　0　0</text>
<text x="431" y="201" class="small">2 × 核</text><text x="544" y="201">0　0　2　6</text>
<path class="line" d="M530 223 H745"/>
<rect class="sum" x="527" y="244" width="220" height="52" rx="8"/>
<text x="431" y="277">相加</text><text x="544" y="277">1　3　2　6</text>
<text x="431" y="337" class="small">这里核长等于步幅，小块恰好相接</text>
<text x="27" y="409">无偏置、padding = 0、dilation = 1</text>
<text x="27" y="446" class="small">尺寸变大不代表信号恢复；形状计算与“是否可逆”是两件事</text>
</svg>
