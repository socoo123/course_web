<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc"><style>text{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172b4d;font-size:20px}.small{font-size:17px}.box{fill:#e8f2ff;stroke:#225d9c;stroke-width:2}.warm{fill:#fff1d6;stroke:#956414;stroke-width:2}.line{fill:none;stroke:#225d9c;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#956414;stroke-width:3;stroke-dasharray:7 5;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#225d9c"/></marker></defs><rect width="720" height="440" rx="16" fill="#f8fbff"/><title id="title">词表的训练与评估边界</title><desc id="desc">规范化后先分区，只有训练文本可以拟合词表，验证测试仅查冻结词表，未知词进入unk。</desc><text x="35" y="42">词表是训练产物，不是全书索引</text><rect class="box" x="220" y="65" width="280" height="55" rx="8"/><text x="250" y="100">规范化与固定划分</text><path class="line" d="M300 120V155H160V180 M420 120V155H560V180"/><rect class="box" x="55" y="180" width="210" height="60" rx="8"/><text x="105" y="218">训练文本</text><rect class="warm" x="455" y="180" width="210" height="60" rx="8"/><text x="490" y="218">验证／测试</text><path class="line" d="M160 240V290"/><text class="small" x="178" y="272">统计与fit</text><rect class="box" x="55" y="290" width="210" height="60" rx="8"/><text x="100" y="328">冻结词表</text><path class="line" d="M265 320H455 M560 240V290"/><text class="small" x="305" y="305">只读查表</text><rect class="warm" x="455" y="290" width="210" height="60" rx="8"/><text x="483" y="328">ID 或 &lt;unk&gt;</text><text x="65" y="405">禁止从评估支路反向增加词或重新排序</text></svg>
