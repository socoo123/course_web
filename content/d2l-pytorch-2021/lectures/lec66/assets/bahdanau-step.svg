<svg xmlns="http://www.w3.org/2000/svg" width="600" height="675" viewBox="0 0 600 675" role="img" aria-labelledby="title desc"><title id="title">Bahdanau单步计算时序</title><desc id="desc">源有效长度同时约束编码终态和注意力可见记忆。上一解码状态查询源记忆，得到context，再与上一词嵌入拼接送入当前GRU，最后预测当前词。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172554;font-size:20px}.small{font-size:17px}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.gate{fill:#ecfdf5;stroke:#047857;stroke-width:2}.warn{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.line{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#a)}@media(prefers-color-scheme:dark){text{fill:#e2e8f0}.box{fill:#172554;stroke:#93c5fd}.gate{fill:#052e2b;stroke:#6ee7b7}.warn{fill:#431407;stroke:#fdba74}.line{stroke:#cbd5e1}}</style><text x="25" y="35">顺序：旧state → context → 当前GRU</text><rect class="box" x="25" y="65" width="265" height="80" rx="12"/><text x="45" y="98">源记忆 M：K / V</text><text class="small" x="45" y="126">仅有效源位置，含EOS</text><rect class="box" x="320" y="65" width="255" height="80" rx="12"/><text x="340" y="98">上一状态 s(t−1)</text><text class="small" x="340" y="126">顶层作为query</text><path class="line" d="M155 145 V185 H270 V210"/><path class="line" d="M445 145 V185 H330 V210"/><rect class="gate" x="80" y="215" width="440" height="80" rx="12"/><text x="105" y="248">加性评分 → masked softmax</text><text class="small" x="105" y="276">权重乘源记忆，得到 context c(t)</text><path class="line" d="M300 295 V345"/><rect class="box" x="25" y="320" width="210" height="75" rx="12"/><text class="small" x="45" y="350">上一词嵌入 E(y(t−1))</text><text class="small" x="45" y="380">首步用BOS</text><path class="line" d="M235 357 H270"/><rect class="gate" x="275" y="350" width="300" height="80" rx="12"/><text x="300" y="383">拼接 → 当前GRU</text><text class="small" x="300" y="412">携带全层旧hidden</text><path class="line" d="M550 145 V330 H500 V345"/><path class="line" d="M425 430 V465"/><rect class="gate" x="275" y="470" width="300" height="70" rx="12"/><text x="300" y="512">新state → 预测 y(t)</text><rect class="warn" x="25" y="565" width="550" height="85" rx="12"/><text class="small" x="45" y="598">源长度必须约束编码终态，不只约束attention。</text><text class="small" x="45" y="627">推理只用源与预测历史；真实目标不进入此路径。</text></svg>
