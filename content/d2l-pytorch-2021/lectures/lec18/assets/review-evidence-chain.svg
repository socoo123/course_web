<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" role="img" aria-labelledby="title desc">
  <title id="title">从固定协议到有限结论的复盘证据链</title>
  <desc id="desc">固定数据划分、预处理和评价协议，做单变量对照，保留每行的折外残差，再进行误差诊断并保存可恢复状态。加州公开规则说明训练成交早于测试，公开榜单早于私榜；这不是任何选手方案的复述。</desc>
  <style>:root { color: #1f2937; } @media (prefers-color-scheme: dark) { :root { filter: invert(1); } }</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <g font-family="system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="currentColor" font-size="18">
    <text x="25" y="35" font-size="24" font-weight="700">不只留下分数，还要留下它成立的条件</text>
    <g fill="none" stroke="currentColor" stroke-width="2">
      <rect x="25" y="80" width="240" height="95" rx="9"/>
      <rect x="320" y="80" width="240" height="95" rx="9"/>
      <rect x="615" y="80" width="240" height="95" rx="9"/>
      <path d="M265 125 H310 M560 125 H605" marker-end="url(#arrow)"/>
      <rect x="25" y="255" width="240" height="95" rx="9"/>
      <rect x="320" y="255" width="240" height="95" rx="9"/>
      <rect x="615" y="255" width="240" height="95" rx="9"/>
      <path d="M735 175 V245 M615 300 H570 M320 300 H275" marker-end="url(#arrow)"/>
      <path d="M25 392 H855"/>
      <path d="M80 475 H815" marker-end="url(#arrow)"/>
      <path d="M140 462 V488 M430 462 V488 M710 462 V488"/>
    </g>
    <text x="43" y="115" font-weight="700">固定协议</text><text x="43" y="150">数据 / 划分 / 指标</text>
    <text x="338" y="115" font-weight="700">对照实验</text><text x="338" y="150">一次改一项，记录预算</text>
    <text x="633" y="115" font-weight="700">折外预测 OOF</text><text x="633" y="150">逐样本残差，保留行号</text>
    <text x="43" y="290" font-weight="700">限定结论</text><text x="43" y="325">哪里有效 / 哪些未做</text>
    <text x="338" y="290" font-weight="700">可恢复状态</text><text x="338" y="325">模型 + 预处理 + 配置</text>
    <text x="633" y="290" font-weight="700">误差诊断</text><text x="633" y="325">方向 / 分组 / 失败记录</text>
    <text x="27" y="218">不把排行榜反复反馈，当作独立泛化证据。</text>
    <text x="27" y="373" font-size="16">OOF 总RMSE：先按样本汇总平方误差，再开根；不是简单平均折RMSE。</text>
    <text x="27" y="429" font-weight="700">加州公开任务描述：成交时间向后推进</text>
    <text x="80" y="456">训练房屋</text><text x="370" y="456">公榜测试房屋</text><text x="650" y="456">私榜测试房屋</text>
    <text x="27" y="519">时间验证是编者据任务提出的建议，不是冠军方案或课堂转述。</text>
    <text x="27" y="550" font-size="16">编者自绘；未下载加州数据，未制作真实比赛误差图，不虚构排名。</text>
  </g>
</svg>
