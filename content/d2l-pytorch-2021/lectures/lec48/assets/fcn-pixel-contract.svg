<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" role="img" aria-labelledby="title desc"><title id="title">FCN像素预测合同</title><desc id="desc">RGB输入经过保留空间的ResNet18骨干、21通道分类卷积、32倍上采样，与整数标签对齐；void不参加监督。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" class="arrow"/></marker></defs><style>svg{background:#f8fafc}text{font-family:system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:20px;fill:#172033}.heading{font-size:25px;font-weight:700}rect{fill:#e8f0ff;stroke:#42638f;stroke-width:2}rect.accent{fill:#fff0d6;stroke:#9a5c13}path{fill:none;stroke:#42638f;stroke-width:2.5;marker-end:url(#arrow)}path.arrow{fill:#42638f;stroke:none;marker-end:none}path.back{stroke:#9a5c13;stroke-dasharray:7 4}@media(prefers-color-scheme:dark){svg{background:#111827}text{fill:#edf2ff}rect{fill:#1f3350;stroke:#99b9ed}rect.accent{fill:#45341d;stroke:#e9bc75}path{stroke:#99b9ed}path.arrow{fill:#99b9ed}path.back{stroke:#e9bc75}}</style><text x="35" y="44" class="heading">空间放大与类别选择是两件事</text><rect x="35" y="75" width="315" height="80" rx="12"/><text x="55" y="107">RGB图像</text><text x="55" y="137">B × 3 × 320 × 480</text><rect x="410" y="75" width="315" height="80" rx="12"/><text x="430" y="107">空间骨干（无全局池化）</text><text x="430" y="137">B × 512 × 10 × 15</text><path d="M355 115 H400"/><path d="M565 164 V200"/><rect x="410" y="210" width="315" height="80" rx="12"/><text x="430" y="242">1×1卷积：512 → 21</text><text x="430" y="272">B × 21 × 10 × 15</text><rect x="35" y="210" width="315" height="80" rx="12"/><text x="55" y="242">转置卷积：空间 ×32</text><text x="55" y="272">B × 21 × 320 × 480</text><path d="M400 250 H360"/><path d="M190 298 V335"/><rect x="35" y="345" width="315" height="90" rx="12"/><text x="55" y="379">类别轴求交叉熵 / argmax</text><text x="55" y="412">不要对彩色图求分类损失</text><rect x="410" y="345" width="315" height="90" rx="12" class="accent"/><text x="430" y="379">标签：B × 320 × 480</text><text x="430" y="412">0–20有效；void忽略</text><path d="M400 390 H360"/></svg>
