<svg xmlns="http://www.w3.org/2000/svg" width="600" height="650" viewBox="0 0 600 650" role="img" aria-labelledby="title desc"><title id="title">加性与点积评分共用掩蔽归一化</title><desc id="desc">上半部两条评分路径，一条分别投影异维查询键并相加，另一条共同维度点积缩放。两者都先屏蔽无效键再softmax，最后乘V。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172554;font-size:20px}.small{font-size:17px}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.gate{fill:#ecfdf5;stroke:#047857;stroke-width:2}.warn{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.line{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#a)}@media(prefers-color-scheme:dark){text{fill:#e2e8f0}.box{fill:#172554;stroke:#93c5fd}.gate{fill:#052e2b;stroke:#6ee7b7}.warn{fill:#431407;stroke:#fdba74}.line{stroke:#cbd5e1}}</style><text x="30" y="35">评分可以换，mask合同不能换</text><rect class="box" x="25" y="65" width="260" height="155" rx="12"/><text x="45" y="100">加性评分</text><text class="small" x="45" y="133">Q: Dq → Ha</text><text class="small" x="45" y="163">K: Dk → Ha</text><text class="small" x="45" y="193">相加 → tanh → 标量</text><rect class="box" x="315" y="65" width="260" height="155" rx="12"/><text x="335" y="100">缩放点积</text><text class="small" x="335" y="133">Q、K最后维同为 d</text><text class="small" x="335" y="163">Q Kᵀ / √d</text><text class="small" x="335" y="193">只转置K的最后两轴</text><path class="line" d="M155 220 V250 H270 V280"/><path class="line" d="M445 220 V250 H330 V280"/><rect class="warn" x="75" y="285" width="450" height="90" rx="12"/><text x="100" y="320">分数 S: (B, Nq, Nk)</text><text class="small" x="100" y="352">先mask无效键；每行至少一个有效键</text><path class="line" d="M300 375 V410"/><rect class="gate" x="75" y="415" width="450" height="65" rx="12"/><text x="105" y="455">稳定softmax → A: (B, Nq, Nk)</text><path class="line" d="M300 480 V515"/><rect class="gate" x="75" y="520" width="450" height="65" rx="12"/><text x="100" y="560">A × V → C: (B, Nq, Dv)</text><text class="small" x="30" y="624">先softmax再清零、不重归一化：错误。</text></svg>
