<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 720" role="img" aria-labelledby="title desc"><title id="title">多头投影与位置偏移</title><desc id="desc">先给词嵌入加正确位置编码，再投影并交换头轴。增量输入的位置从历史长度开始，而非重置为零。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs><rect width="560" height="720" rx="16" fill="#f8fafc"/><g font-family="sans-serif" fill="#172554" text-anchor="middle"><text x="280" y="35" font-size="22" font-weight="bold">同一输入，不同投影；同一历史，连续位置</text><g stroke="#2563eb" stroke-width="2" fill="#dbeafe"><rect x="70" y="58" width="420" height="75" rx="10"/><rect x="70" y="174" width="420" height="75" rx="10"/><rect x="70" y="290" width="420" height="75" rx="10"/><rect x="70" y="406" width="420" height="75" rx="10"/></g><g font-size="20"><text x="280" y="88">√d · E(token) + P[position]</text><text x="280" y="116">输入 (B, T, d)</text><text x="280" y="204">独立 WQ / WK / WV</text><text x="280" y="232">每项投影后仍为 (B, T, d)</text><text x="280" y="320">拆头 → 交换时间与头轴</text><text x="280" y="348">(B, h, T, d/h)</text><text x="280" y="436">各头汇聚 → 逆交换 → 合头 → WO</text><text x="280" y="464">输出 (B, Tq, d)</text></g><g stroke="#334155" stroke-width="2" marker-end="url(#a)"><path d="M280 133V170"/><path d="M280 249V286"/><path d="M280 365V402"/></g><rect x="30" y="518" width="500" height="170" rx="10" fill="#fef3c7" stroke="#b45309"/><text x="280" y="549" font-size="21" font-weight="bold">增量位置必须延续</text><g font-size="19"><text x="280" y="584">已有：BOS / a / b → 位置 0 / 1 / 2</text><text x="280" y="619">新块：c / d → 位置 3 / 4</text><text x="280" y="655">取 P[3:5]，不是 P[0:2]</text></g></g></svg>
