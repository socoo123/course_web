<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 570" role="img" aria-labelledby="title desc">
<title id="title">分片计算，按全局样本数归一化</title>
<desc id="desc">全局三个样本分为两个和一个样本。各副本从相同参数开始，局部梯度和为5和9，求和除以3得到14除以3，再用同一梯度更新两个副本。示意为CPU数学推演而非GPU实测。</desc>
<style>svg{color:#172b4d;background:#fff;font:16px system-ui,'PingFang SC','Microsoft YaHei',sans-serif}.box{fill:#edf4fc;stroke:#446a91;stroke-width:1.5}.sum{fill:#e5f5ed;stroke:#31765a;stroke-width:1.5}text{fill:currentColor;text-anchor:middle}.edge{fill:none;stroke:currentColor;stroke-width:1.6}.small{font-size:14px}@media(prefers-color-scheme:dark){svg{color:#eef3ff;background:#111827}.box{fill:#20304a;stroke:#99b9de}.sum{fill:#163e32;stroke:#8cd4b3}}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker></defs>
<text x="180" y="28" font-weight="700">同一步：先聚合，再更新</text>
<rect class="box" x="40" y="46" width="280" height="64" rx="10"/>
<text x="180" y="72">全局 batch：3 个样本</text><text x="180" y="96" class="small">x = [1, 2, 3]，初值 θ = 1</text>
<path class="edge" d="M125 110 V145 H89 V165 M235 110 V145 H271 V165" marker-end="url(#arrow)"/>
<rect class="box" x="14" y="165" width="150" height="116" rx="10"/><rect class="box" x="196" y="165" width="150" height="116" rx="10"/>
<text x="89" y="193">副本 A：θ = 1</text><text x="89" y="219">2 个样本</text><text x="89" y="245">局部 sum = 5</text><text x="89" y="266" class="small">mean = 2.5</text>
<text x="271" y="193">副本 B：θ = 1</text><text x="271" y="219">1 个样本</text><text x="271" y="245">局部 sum = 9</text><text x="271" y="266" class="small">mean = 9</text>
<path class="edge" d="M89 281 V305 H180 V330 M271 281 V305 H180" marker-end="url(#arrow)"/>
<rect class="sum" x="40" y="330" width="280" height="74" rx="10"/><text x="180" y="358">全局梯度 = (5 + 9) / 3</text><text x="180" y="385">同一个结果：14 / 3</text>
<path class="edge" d="M180 404 V431 H89 V453 M180 431 H271 V453" marker-end="url(#arrow)"/>
<rect class="box" x="14" y="453" width="150" height="63" rx="10"/><rect class="box" x="196" y="453" width="150" height="63" rx="10"/>
<text x="89" y="479">同一学习率</text><text x="89" y="502">同一更新结果</text><text x="271" y="479">同一优化器状态</text><text x="271" y="502">同一更新结果</text>
<text x="180" y="547" class="small">数学依赖示意；非通信时序或吞吐实测</text>
</svg>
