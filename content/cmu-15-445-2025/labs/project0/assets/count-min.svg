<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="cms-title cms-desc">
  <title id="cms-title">不同碰撞仍可能使最小值高估</title>
  <desc id="cms-desc">原创假定哈希示例。流 A B A C A，宽四深二。第一行为零、四、一、零，第二行为一、零、零、四。A 在两行读到四和四，估计四，大于真实计数三。第一行噪声来自 B，第二行来自 C。</desc>
  <style>
    svg { color: var(--text-primary, #334155); }
    text { fill: currentColor; font-family: system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 18px; }
    .grid { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .selected { fill: none; stroke: var(--accent-color, #2563eb); stroke-width: 3; }
    .accent { fill: var(--accent-color, #2563eb); }
    .small { font-size: 16px; }
  </style>
  <text x="24" y="30">输入：A → B → A → C → A</text>
  <text x="160" y="69" class="small">列 0</text><text x="250" y="69" class="small">列 1</text><text x="340" y="69" class="small">列 2</text><text x="430" y="69" class="small">列 3</text>
  <path class="grid" d="M140 84 H500 V204 H140 Z M140 144 H500 M230 84 V204 M320 84 V204 M410 84 V204"/>
  <rect class="selected" x="230" y="84" width="90" height="60"/><rect class="selected" x="410" y="144" width="90" height="60"/>
  <text x="25" y="120">第 0 行</text><text x="25" y="180">第 1 行</text>
  <g text-anchor="middle"><text x="185" y="121">0</text><text x="275" y="121" class="accent">4</text><text x="365" y="121">1</text><text x="455" y="121">0</text><text x="185" y="181">1</text><text x="275" y="181">0</text><text x="365" y="181">0</text><text x="455" y="181" class="accent">4</text></g>
  <text x="520" y="120" class="small">A + B</text><text x="520" y="180" class="small">A + C</text>
  <text x="24" y="244">查询 A：min(4, 4) = 4；真实次数 = 3</text>
  <text x="24" y="277" class="small">每行总和均为 5；框线标出 A 的桶。非实测哈希。</text>
</svg>
