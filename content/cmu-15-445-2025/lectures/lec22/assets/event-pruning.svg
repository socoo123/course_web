<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 332" role="img" aria-labelledby="t d"><title id="t">按首个订单事件的时间排除 granule</title><desc id="d">某个已排序的 part 的稀疏索引是 10:00、10:10、10:20。问 10:13 至 10:16，排除首尾，只需读中段后逐行核对；此例每段的键互不跨界。</desc><rect width="390" height="332" rx="12" fill="#f4f7f9"/><g fill="#173747" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif"><text x="18" y="33" font-size="22" font-weight="700">一个 part，一次时间窗口查询</text><text x="19" y="60" font-size="16">目标：10:13 ≤ event_time ＜ 10:16</text><text x="19" y="99" font-size="17" font-weight="700">内存索引：只看每段的第一个键</text><g font-size="16"><rect x="18" y="118" width="354" height="42" rx="7" fill="#e4eaf0"/><text x="30" y="144">10:00　段 0　已在开始时间之前 → 跳过</text><rect x="18" y="168" width="354" height="42" rx="7" fill="#d2ece3" stroke="#417664"/><text x="30" y="194">10:10　段 1　可能含匹配行 → 取这一段</text><rect x="18" y="218" width="354" height="42" rx="7" fill="#e4eaf0"/><text x="30" y="244">10:20　段 2　晚于窗口上界 → 跳过</text><text x="19" y="290">读入段 1 后仍要逐行判断，不是整段命中。</text><text x="19" y="315" fill="#435966">图中不同段时间不重叠，无重复边界键。</text></g></g></svg>