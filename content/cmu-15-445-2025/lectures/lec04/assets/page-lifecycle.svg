<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 630" role="img" aria-labelledby="title desc">
  <title id="title">页身份、帧地址与使用权的生命周期</title>
  <desc id="desc">原创示例：Orders 页42先位于帧0；两个使用者持有 pin 时不能驱逐，写者还需数据 latch；最后一个使用者释放后，脏页必须完成安全写回才能复用帧。页42以后可以读入帧7，旧指针不能继续使用。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#546e7a"/></marker></defs>
  <style>text{font-family:system-ui,"Noto Sans CJK SC","PingFang SC",sans-serif;fill:#172d3b;font-size:18px}.heading{font-size:23px;font-weight:700}.label{font-size:16px}.box{fill:#edf5fb;stroke:#3979a5;stroke-width:2}.warn{fill:#fff4df;stroke:#aa741d;stroke-width:2}.line{stroke:#546e7a;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  <rect x="8" y="8" width="864" height="614" rx="16" fill="#fff"/>
  <text x="35" y="45" class="heading">页是身份，帧是可复用位置，pin 是暂时使用权</text>
  <rect x="35" y="75" width="245" height="95" rx="9" class="box"/>
  <text x="52" y="106">磁盘 Orders / page 42</text><text x="52" y="137" class="label">page directory → 文件位置</text>
  <path d="M280 122 H340" class="line"/><text x="288" y="105" class="label">读入</text>
  <rect x="345" y="75" width="490" height="95" rx="9" class="box"/>
  <text x="364" y="106">内存 frame 0：page 42 的页面字节</text><text x="364" y="137" class="label">page table[42] = 0；两个使用者 → pin = 2</text>
  <path d="M590 170 V213" class="line"/>
  <rect x="345" y="220" width="490" height="102" rx="9" class="warn"/>
  <text x="364" y="251">读者/写者持有 pin：禁止换页</text><text x="364" y="281" class="label">写字节还需适当 latch；写后 dirty = true</text><text x="364" y="307" class="label">pin 不替代 latch，latch 不等于事务 lock</text>
  <rect x="35" y="220" width="245" height="102" rx="9" class="warn"/>
  <text x="52" y="252">Clock access bit = 0？</text><text x="52" y="281" class="label">只是替换线索</text><text x="52" y="307" class="label">不能推导 pin = 0</text>
  <path d="M590 322 V365" class="line"/>
  <rect x="345" y="372" width="490" height="93" rx="9" class="box"/>
  <text x="364" y="404">最后一个使用者释放 → pin = 0</text><text x="364" y="434" class="label">成为可考虑的候选；dirty 页先完成必要写回</text>
  <path d="M590 465 V508" class="line"/>
  <rect x="345" y="515" width="490" height="78" rx="9" class="box"/>
  <text x="364" y="546">撤销旧映射，frame 0 可供其他页使用</text><text x="364" y="576" class="label">后续 page 42 → frame 7：重新申请，取得新指针</text>
  <text x="35" y="399" class="heading">检查三个问题</text><text x="35" y="435">谁还在用？ → pin</text><text x="35" y="472">谁能碰字节？ → latch</text><text x="35" y="509">修改已保存？ → dirty / I/O</text><text x="35" y="577" class="label">自拟逻辑流程；不是锁顺序或源码实现图</text>
</svg>
