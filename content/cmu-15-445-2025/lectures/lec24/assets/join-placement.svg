<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 478" role="img" aria-labelledby="title desc"><title id="title">订单行按商品键连接：在哪一步搬数据？</title><desc id="desc">四种数据布局分别是小表已经复制、双方同键同地、小表要广播、双大表要重分区；四种方案最后都以局部连接汇集结果。</desc><rect width="360" height="478" rx="14" fill="#f7f5ef"/><g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif" fill="#182f32"><text x="18" y="33" font-size="20" font-weight="700">连接订单行 R 和商品 S：按 sku</text><g stroke="#afc0bc"><rect x="16" y="55" width="328" height="77" rx="8" fill="#e2f2e9"/><rect x="16" y="143" width="328" height="77" rx="8" fill="#e2f2e9"/><rect x="16" y="231" width="328" height="77" rx="8" fill="#f7e9d7"/><rect x="16" y="319" width="328" height="77" rx="8" fill="#f7e9d7"/></g><g font-size="17" font-weight="700"><text x="28" y="82">① 每处已有完整的 S</text><text x="28" y="170">② 两表本来就按 sku 同地分区</text><text x="28" y="258">③ S 很小，却散在不同机器</text><text x="28" y="346">④ 两表都大，原布局都不匹配</text></g><g font-size="15"><text x="28" y="110">不搬输入：本地 R × 本地 S 中找匹配。</text><text x="28" y="198">不搬输入：各处只匹配自己那一段。</text><text x="28" y="286">广播 S 的各片段 → 各处都有完整 S。</text><text x="28" y="374">按相同 sku 规则交换两侧行 → 同地。</text></g><path d="M180 402V423m-6-6 6 6 6-6" fill="none" stroke="#376665" stroke-width="2"/><text x="180" y="451" text-anchor="middle" font-size="17" font-weight="700">局部 JOIN → 汇集行（不擅自去重）</text></g></svg>