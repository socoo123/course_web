<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 414" role="img" aria-labelledby="title desc"><title id="title">跨两个分片的事务，不能把六台副本混在一起数票</title><desc id="desc">订单组和库存组各有三个副本。组内两个能形成多数，跨组需要两份能准备好的证明。库存说否，订单组三个赞成也不够。</desc><rect width="360" height="414" rx="14" fill="#f7f5ef"/><g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif" fill="#182f32"><text x="18" y="33" font-size="21" font-weight="700">多数票要在哪个圈里数？</text><rect x="16" y="52" width="328" height="97" rx="9" fill="#e0edf4" stroke="#7896a4"/><rect x="16" y="164" width="328" height="97" rx="9" fill="#f9e8d4" stroke="#b3936d"/><g font-size="18" font-weight="650"><text x="29" y="79">O · 订单分片的同一段日志</text><text x="29" y="191">S · 库存分片的另一段日志</text></g><g text-anchor="middle" font-size="16"><g stroke="#759199" fill="#fff"><rect x="32" y="96" width="81" height="38" rx="5"/><rect x="137" y="96" width="81" height="38" rx="5"/><rect x="242" y="96" width="81" height="38" rx="5"/><rect x="32" y="208" width="81" height="38" rx="5"/><rect x="137" y="208" width="81" height="38" rx="5"/><rect x="242" y="208" width="81" height="38" rx="5"/></g><text x="72" y="121">O₁</text><text x="177" y="121">O₂</text><text x="282" y="121">O₃</text><text x="72" y="233">S₁</text><text x="177" y="233">S₂</text><text x="282" y="233">S₃</text></g><text x="20" y="294" font-size="17" font-weight="700">组内：同一值由本组多数见证。</text><text x="20" y="321" font-size="15">O 的两个副本不能代表 S 的一个副本。</text><path d="M20 339H340" stroke="#a4adaa"/><text x="20" y="366" font-size="17" font-weight="700">跨组：O 和 S 各自都要能履约。</text><text x="20" y="393" font-size="15">即使 O 全员在线，库存不足仍须中止。</text></g></svg>