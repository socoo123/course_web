<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 644" role="img" aria-labelledby="title desc"><title id="title">订单 42 的五道证据门槛</title><desc id="desc">从发送准备请求、对端收到字节，到分片持久准备、协调者持久决定、参与者应用结果。只有两分片都准备好才能决定提交。</desc><rect width="360" height="644" rx="14" fill="#f7f5ef"/><g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif" fill="#182f32"><text x="20" y="33" font-size="21" font-weight="700">订单 42：回复证明了什么？</text><text x="20" y="58" font-size="15">O 记订单，S 扣库存；C 协调事务。</text><path d="M36 84V570" fill="none" stroke="#547d80" stroke-width="3"/><g fill="#fff" stroke="#b5c5c2"><rect x="53" y="76" width="289" height="83" rx="8"/><rect x="53" y="173" width="289" height="83" rx="8"/><rect x="53" y="270" width="289" height="94" rx="8"/><rect x="53" y="378" width="289" height="99" rx="8" fill="#e1f2e9" stroke="#3d7963"/><rect x="53" y="491" width="289" height="94" rx="8"/></g><g fill="#236368"><circle cx="36" cy="99" r="13"/><circle cx="36" cy="196" r="13"/><circle cx="36" cy="293" r="13"/><circle cx="36" cy="401" r="13"/><circle cx="36" cy="514" r="13"/></g><g fill="#fff" font-size="16" text-anchor="middle"><text x="36" y="105">1</text><text x="36" y="202">2</text><text x="36" y="299">3</text><text x="36" y="407">4</text><text x="36" y="520">5</text></g><g font-size="18" font-weight="700"><text x="67" y="103">C 发出 PREPARE</text><text x="67" y="200">S 的 TCP 栈收到字节</text><text x="67" y="297">S 持久记录 PREPARED</text><text x="67" y="405">C 持久记录 COMMIT</text><text x="67" y="518">各分片执行决定，回 ACK</text></g><g font-size="15"><text x="67" y="131">发送成功，不证明远端收到。</text><text x="67" y="228">传输确认，不证明程序已处理。</text><text x="67" y="325">此时 S 才能投 YES；</text><text x="67" y="348">它承诺可提交，还不知道结局。</text><text x="67" y="434">前提：O、S 两份 YES 已收全。</text><text x="67" y="458">此后通知丢了也不能改判。</text><text x="67" y="547">回执报告进度，不是第二次投票。</text><text x="67" y="570">客户端的回复也可能单独丢失。</text></g><text x="20" y="618" font-size="16" font-weight="650">不要把 TCP ACK、YES、COMMIT 混读。</text></g></svg>