<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">订单查询的逻辑层与物理层</title><desc id="desc">应用通过稳定逻辑模式查询订单和库存；物理层可选择扫描或索引，不把地址作为业务关联。下半部分显示先筛选库存再连接订单的代数树。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="#34536c"/></marker></defs><rect width="960" height="620" fill="#f5f8fc"/><g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#17324a"><text x="40" y="40" font-size="25" font-weight="700">查询说“要什么”，不暴露记录地址</text><g fill="#e1efff" stroke="#517ca5" stroke-width="2"><rect x="40" y="65" width="880" height="65" rx="12"/><rect x="40" y="165" width="880" height="80" rx="12"/><rect x="40" y="285" width="400" height="70" rx="12"/><rect x="520" y="285" width="400" height="70" rx="12"/></g><text x="65" y="105" font-size="21">应用：返回仍有库存的订单 ID（SQL / 外部视图）</text><text x="65" y="198" font-size="21">逻辑：Orders(order_id, sku, qty)　Stock(sku, available)</text><text x="65" y="227" font-size="18">通过 sku 的值关联；不是“第 17 页第 3 条”的位置关联</text><text x="70" y="326" font-size="21">物理选择 A：扫描文件 / 页</text><text x="548" y="326" font-size="21">物理选择 B：利用索引查找</text><g stroke="#34536c" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M480 130V160"/><path d="M270 245V280"/><path d="M715 245V280"/></g><text x="40" y="399" font-size="23" font-weight="700">同一个结果，可用不同代数计划推导</text><g fill="#e5f4eb" stroke="#508165" stroke-width="2"><rect x="45" y="475" width="250" height="65" rx="10"/><rect x="365" y="475" width="250" height="65" rx="10"/><rect x="690" y="475" width="220" height="65" rx="10"/></g><text x="65" y="502" font-size="19">Stock：先筛选</text><text x="65" y="529" font-size="19">available &gt; 0</text><text x="385" y="502" font-size="19">按 sku 连接 Orders</text><text x="385" y="529" font-size="19">只保留匹配组合</text><text x="710" y="515" font-size="19">投影 order_id</text><g stroke="#34536c" stroke-width="2" marker-end="url(#arrow)"><path d="M295 508H358"/><path d="M615 508H683"/></g><text x="45" y="587" font-size="18">编者自拟示意：逻辑等价不保证物理代价相同；图中不指定连接算法。</text></g></svg>