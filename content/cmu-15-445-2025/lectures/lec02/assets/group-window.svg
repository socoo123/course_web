<svg xmlns="http://www.w3.org/2000/svg" width="640" height="550" viewBox="0 0 640 550" role="img" aria-labelledby="title desc">
  <title id="title">聚合与窗口计算的输出粒度</title>
  <desc id="desc">三笔A商品订单数量为2、2和NULL。分组聚合输出一行A，订单数3，已知需求4；窗口计算保留三笔订单，每笔附上同一个已知需求4。</desc>
  <style>
    :root { color-scheme: light dark; --ink: #243b53; --accent: #206c91; --muted: #586a7c; }
    @media (prefers-color-scheme: dark) { :root { --ink: #e1e9f2; --accent: #7dd3fc; --muted: #b7c5d4; } }
    svg { color: var(--ink); }
    text { fill: currentColor; font-family: system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 20px; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.6; }
    .flow { fill: none; stroke: var(--accent); stroke-width: 2; }
    .small { font-size: 17px; fill: var(--muted); }
    .title { font-size: 24px; font-weight: 700; }
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/></marker></defs>
  <text x="24" y="34" class="title">同样的输入，不同的结果粒度</text>
  <rect x="24" y="58" width="592" height="96" rx="8" class="box"/>
  <text x="42" y="88">Orders：A 商品的三笔订单</text>
  <text x="42" y="124">101 → 2　　102 → 2　　103 → NULL</text>
  <path d="M175 154 V199" class="flow" marker-end="url(#arrow)"/>
  <path d="M465 154 V319" class="flow" marker-end="url(#arrow)"/>
  <rect x="24" y="205" width="360" height="100" rx="8" class="box"/>
  <text x="42" y="238">GROUP BY sku：压成一行</text>
  <text x="42" y="275">A　订单数 3　已知需求 4</text>
  <rect x="24" y="330" width="592" height="165" rx="8" class="box"/>
  <text x="42" y="363">SUM(qty) OVER (PARTITION BY sku)</text>
  <text x="42" y="400">101　A　2　　 已知需求 4</text>
  <text x="42" y="435">102　A　2　　 已知需求 4</text>
  <text x="42" y="470">103　A　NULL　已知需求 4</text>
  <text x="24" y="532" class="small">窗口保留明细；NULL 数量不参与 SUM，但订单行仍存在。</text>
</svg>
