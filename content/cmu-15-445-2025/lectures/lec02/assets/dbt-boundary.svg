<svg xmlns="http://www.w3.org/2000/svg" width="640" height="570" viewBox="0 0 640 570" role="img" aria-labelledby="title desc">
  <title id="title">dbt 管理转换，数据仓库执行查询</title>
  <desc id="desc">仓库中的原始订单和库存先被整理成staging模型，再得到共享商品需求，提供给BI报表。dbt使用受版本控制的SQL、依赖和测试管理这些关系的构建；读取和写入仍由客户的数据仓库完成。</desc>
  <style>
    :root { color-scheme: light dark; --ink: #243b53; --accent: #206c91; --muted: #586a7c; }
    @media (prefers-color-scheme: dark) { :root { --ink: #e1e9f2; --accent: #7dd3fc; --muted: #b7c5d4; } }
    svg { color: var(--ink); }
    text { fill: currentColor; font: 20px system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    rect { fill: none; stroke: currentColor; stroke-width: 1.6; }
    .flow { fill: none; stroke: var(--accent); stroke-width: 2; }
    .small { font-size: 17px; fill: var(--muted); }
    .title { font-size: 24px; font-weight: 700; }
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/></marker></defs>
  <text x="24" y="34" class="title">数据依赖 ≠ 自建执行引擎</text>
  <rect x="24" y="62" width="592" height="335" rx="12"/>
  <text x="42" y="93">客户的数据仓库：实际运行 SQL、保存关系</text>
  <rect x="54" y="116" width="240" height="52" rx="6"/>
  <rect x="346" y="116" width="240" height="52" rx="6"/>
  <text x="77" y="149">原始 Orders</text><text x="372" y="149">原始 Stock</text>
  <path d="M174 168 V202 M466 168 V202" class="flow" marker-end="url(#arrow)"/>
  <rect x="54" y="210" width="240" height="52" rx="6"/>
  <rect x="346" y="210" width="240" height="52" rx="6"/>
  <text x="77" y="244">订单 staging 模型</text><text x="369" y="244">库存 staging 模型</text>
  <path d="M174 262 V285 H320 V308 M466 262 V285 H320" class="flow"/>
  <path d="M320 298 V310" class="flow" marker-end="url(#arrow)"/>
  <rect x="145" y="316" width="350" height="56" rx="6"/>
  <text x="172" y="351">共享商品需求 / BI 查询结果</text>
  <rect x="24" y="443" width="592" height="99" rx="10"/>
  <text x="42" y="475">dbt：SQL 定义 + 依赖 + 测试 + 构建</text>
  <text x="42" y="512" class="small">版本控制与开发流程；不把仓库数据搬进新引擎。</text>
  <path d="M320 443 V405" class="flow" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="343" y="426" class="small">提交生成的 SQL</text>
</svg>
