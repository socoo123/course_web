<svg xmlns="http://www.w3.org/2000/svg" width="720" height="660" viewBox="0 0 720 660" role="img" aria-labelledby="title desc">
<title id="title">重复键组的六个连接配对</title><desc id="desc">Orders中两个sku为7的订单与Stock中三个sku为7的仓库记录连接，必须产生六个不同配对。内侧需要保存重复组起点或缓存全组。</desc>
<style>svg{color-scheme:light dark;font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif}text{fill:var(--fg,currentColor);font-size:24px}.h{font-size:29px;font-weight:700}.s{font-size:21px}.box{fill:none;stroke:var(--border,currentColor);stroke-width:2}.key{fill:var(--accent,currentColor)}.line{stroke:var(--accent,currentColor);stroke-width:2;fill:none}</style>
<text x="36" y="46" class="h">同一个键，不止一对结果</text>
<rect x="36" y="75" width="290" height="176" rx="12" class="box"/><rect x="394" y="75" width="290" height="176" rx="12" class="box"/>
<text x="56" y="112">Orders：sku = 7</text><text x="56" y="164">订单 A</text><text x="56" y="214">订单 B</text>
<text x="414" y="112">Stock：sku = 7</text><text x="414" y="154">仓库 X</text><text x="414" y="194">仓库 Y</text><text x="414" y="234">仓库 Z</text>
<path d="M300 156 L405 146 M300 156 L405 186 M300 156 L405 226 M300 206 L405 146 M300 206 L405 186 M300 206 L405 226" class="line"/>
<text x="36" y="300" class="h">2 × 3 = 6 对</text>
<rect x="36" y="324" width="648" height="110" rx="12" class="box"/>
<text x="60" y="366">A–X　 A–Y　 A–Z</text><text x="60" y="410">B–X　 B–Y　 B–Z</text>
<text x="36" y="482">处理订单 B 时，复用整个内侧组。</text><text x="36" y="526">保存组起点 / 缓存组，不只记最后值。</text>
<text x="36" y="581" class="s">驻留组可免重读，不能免除六对输出。</text><text x="36" y="620" class="s">原创示例 · 不是课堂截图或执行器实现</text>
</svg>
