<svg xmlns="http://www.w3.org/2000/svg" width="720" height="850" viewBox="0 0 720 850" role="img" aria-labelledby="title desc">
<title id="title">Grace哈希连接的对应分区不变量</title><desc id="desc">Orders和Stock使用相同键编码与哈希规则，产生对应分区。一次只连接一对分区，局部build驻留、probe流过。超预算时两侧同一对应分区用相同新规则递归。</desc>
<style>svg{color-scheme:light dark;font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif}text{fill:var(--fg,currentColor);font-size:24px}.h{font-size:28px;font-weight:700}.s{font-size:20px}.box{fill:none;stroke:var(--border,currentColor);stroke-width:2}.hi{fill:none;stroke:var(--accent,currentColor);stroke-width:3}.a{fill:none;stroke:var(--accent,currentColor);stroke-width:3;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--accent,currentColor)"/></marker></defs>
<text x="32" y="46" class="h">相等键必须走相同路由</text>
<rect x="32" y="75" width="280" height="70" rx="10" class="box"/><rect x="408" y="75" width="280" height="70" rx="10" class="box"/>
<text x="70" y="120">R：Orders</text><text x="446" y="120">S：Stock</text>
<path d="M172 148 V200 M548 148 V200" class="a"/><text x="215" y="185" class="s">相同 h₁ / 键编码</text>
<rect x="32" y="220" width="280" height="62" rx="8" class="hi"/><rect x="408" y="220" width="280" height="62" rx="8" class="hi"/>
<text x="62" y="261">分区 0：R₀</text><text x="438" y="261">分区 0：S₀</text>
<rect x="32" y="300" width="280" height="62" rx="8" class="box"/><rect x="408" y="300" width="280" height="62" rx="8" class="box"/>
<text x="62" y="341">分区 1：R₁</text><text x="438" y="341">分区 1：S₁</text>
<rect x="32" y="380" width="280" height="62" rx="8" class="box"/><rect x="408" y="380" width="280" height="62" rx="8" class="box"/>
<text x="62" y="421">分区 2：R₂</text><text x="438" y="421">分区 2：S₂</text>
<text x="32" y="489">只处理同编号：R₀ ⋈ S₀，再换下一对</text>
<rect x="32" y="518" width="656" height="126" rx="12" class="hi"/>
<text x="56" y="559">局部 build 哈希表驻留内存</text><text x="56" y="605">对应 probe 分区逐页流过、核对真实键</text>
<path d="M360 648 V689" class="a"/><text x="32" y="735">若超预算：只重分这对分区，双方同用 h₂</text><text x="32" y="782" class="s">同键热组不会被换函数拆小，必须改处理策略。</text><text x="32" y="821" class="s">原创流程 · 不展示完整项目代码</text>
</svg>
