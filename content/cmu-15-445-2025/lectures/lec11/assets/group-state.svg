<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" role="img" aria-labelledby="title desc">
<title id="title">排序与哈希如何证明一个分组已完整</title>
<desc id="desc">同一订单输入A十、B三十、A二十。排序使A相邻，组边界即可输出平均十五；哈希保证所有A在同一分区，分区完整后才能最终输出，状态为和三十、计数二。不同键碰撞仍需完整键比较。</desc>
<style>text{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:var(--fg,currentColor);font-size:13px}.box{fill:none;stroke:var(--accent,currentColor);stroke-width:1.4}.sub{font-size:11px;fill:var(--muted,currentColor)}.line{stroke:var(--accent,currentColor);stroke-width:2;fill:none}</style>
<text x="180" y="29" text-anchor="middle" font-size="17">什么时候可以结束 A 组？</text>
<rect class="box" x="20" y="47" width="320" height="45" rx="6"/>
<text x="180" y="75" text-anchor="middle">输入：(A,10)　(B,30)　(A,20)</text>
<text x="24" y="126" font-weight="bold">排序：组边界证明后面没有 A</text>
<rect class="box" x="20" y="143" width="320" height="77" rx="6"/>
<text x="180" y="170" text-anchor="middle">(A,10) → (A,20) │ (B,30)</text>
<text class="sub" x="180" y="197" text-anchor="middle">当前组状态：sum = 30，count = 2</text>
<path class="line" d="M180 221v24m-5-6 5 6 5-6"/>
<text x="180" y="269" text-anchor="middle">见到 B：输出 (A,15)，重新初始化</text>
<text x="24" y="310" font-weight="bold">哈希：同键同分区证明不会跨区</text>
<rect class="box" x="20" y="328" width="320" height="78" rx="6"/>
<text x="180" y="353" text-anchor="middle">h₁(A) → 分区 0：A10、A20</text>
<text class="sub" x="180" y="378" text-anchor="middle">h₂ 定位组状态；碰撞后仍比较完整 key</text>
<path class="line" d="M180 407v24m-5-6 5 6 5-6"/>
<text x="180" y="455" text-anchor="middle">分区 0 完成：输出 (A,15)</text>
<text class="sub" x="180" y="488" text-anchor="middle">A 出现一亿次，不等于一亿份分组状态</text>
<text class="sub" x="180" y="510" text-anchor="middle">递归哈希无法把同一个 A 拆成不同组</text>
<text class="sub" x="180" y="539" text-anchor="middle">原创 Orders 示例；与课堂数据不同</text>
</svg>
