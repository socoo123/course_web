<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" role="img" aria-labelledby="title desc">
<title id="title">LSM 库存更新的状态与持久化路径</title>
<desc id="desc">Put 和 Delete 先进入内存 memtable，独立日志承担恢复记录，flush 产生不可变有序 SSTable。读取从新状态向旧状态查找，删除标记遮蔽旧值。归并不能提前删除仍用于遮蔽旧数据的 tombstone。</desc>
<style>text{font-family:system-ui,"Noto Sans CJK SC","PingFang SC",sans-serif;fill:currentColor;font-size:19px}.box{fill:none;stroke:currentColor;stroke-width:2}.accent{fill:none;stroke:var(--accent,#287c9a);stroke-width:3}.small{font-size:16px}.label{fill:var(--accent,#287c9a);font-weight:600}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="var(--accent,#287c9a)"/></marker></defs>
<text x="30" y="35" font-size="24">同一个 key 的新状态，不必写回旧位置</text>
<rect class="box" x="30" y="65" width="250" height="110" rx="8"/>
<text x="48" y="96">业务操作（完整 value）</text><text x="48" y="128" class="small">Put(A, available=2, …)</text><text x="48" y="154" class="small">随后 Delete(A)</text>
<rect class="accent" x="410" y="65" width="420" height="110" rx="8"/>
<text x="430" y="98" class="label">内存 memtable：最新状态</text><text x="430" y="131">A → tombstone</text><text x="430" y="157" class="small">本讲模型允许内存中替换旧值</text>
<path class="accent" d="M280 110 H405" marker-end="url(#arrow)"/>
<text x="305" y="96" class="small">接收写入</text>
<path class="box" d="M20 222 H850" stroke-dasharray="7 7"/>
<text x="30" y="210" class="small">内存</text><text x="30" y="247" class="small">非易失存储</text>
<rect class="box" x="30" y="282" width="250" height="108" rx="8"/>
<text x="48" y="314">独立 WAL／恢复日志</text><text x="48" y="343" class="small">按提交协议持久化</text><text x="48" y="370" class="small">不是 SSTable 的别名</text>
<path class="accent" d="M150 175 V276" marker-end="url(#arrow)"/>
<rect class="accent" x="410" y="280" width="420" height="90" rx="8"/>
<text x="430" y="311" class="label">较新 SSTable R2（不可变）</text><text x="430" y="344">A → tombstone</text>
<path class="accent" d="M620 175 V274" marker-end="url(#arrow)"/>
<text x="636" y="256" class="small">flush：按 key 排序</text>
<rect class="box" x="410" y="400" width="420" height="90" rx="8"/>
<text x="430" y="432">较旧 SSTable R1（仍未改写）</text><text x="430" y="465">A → available=3, description=bolt</text>
<path class="accent" d="M365 296 V469" marker-end="url(#arrow)"/>
<text x="302" y="422" class="small">读取</text><text x="302" y="448" class="small">新→旧</text>
<text x="30" y="531" class="label">看到较新 Delete 就停止：逻辑不存在 ≠ 旧字节已物理擦除</text>
<text x="30" y="557" class="small">原创教学模型；MVCC 可见性、日志提交与安全回收需要额外协议。</text>
</svg>
