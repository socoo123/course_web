<svg xmlns="http://www.w3.org/2000/svg" width="352" height="458" viewBox="0 0 352 458" role="img" aria-labelledby="title desc"><title id="title">四件不同的事：发送、收到、持久化、事务决定</title><desc id="desc">示例事务涉及订单甲和库存丙。甲发出日志，副本接收字节，副本刷日志并回传持久确认；这些均不能替代甲丙双方参与的可恢复事务决定。提交决定形成之后回复还会丢失。</desc><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif"><rect width="352" height="458" rx="14" fill="#152c3b"/><text x="18" y="33" font-size="20" fill="white" font-weight="700">这四个时刻不能画在同一点</text><text x="18" y="57" font-size="14" fill="#d1e4ec">订单甲 → 甲副本；库存另在分片丙。</text><path d="M38 93v287" stroke="#7d9ca8" stroke-width="3"/><g font-size="15" text-anchor="middle" fill="white" font-weight="700"><circle cx="38" cy="98" r="17" fill="#336079"/><text x="38" y="103">1</text><circle cx="38" cy="175" r="17" fill="#336079"/><text x="38" y="180">2</text><circle cx="38" cy="254" r="17" fill="#337050"/><text x="38" y="259">3</text><circle cx="38" cy="341" r="17" fill="#855624"/><text x="38" y="346">4</text></g><g font-size="16" fill="white" font-weight="700"><text x="67" y="98">甲发出这条日志</text><text x="67" y="175">甲副本的网络栈收到字节</text><text x="67" y="254">甲副本的日志已经持久化</text><text x="67" y="341">甲与丙的事务有了提交决定</text></g><g font-size="14" fill="#d6e6ee"><text x="67" y="123">网络里有消息 ≠ 对面收到了。</text><text x="67" y="200">TCP ACK ≠ 数据库刷了日志。</text><text x="67" y="279">该副本可回持久 ACK；</text><text x="67" y="299">它不能替丙对这笔事务表态。</text><text x="67" y="366">本例还要求跨片原子决定可恢复；</text><text x="67" y="387">不能只看一条已落盘的业务更新。</text></g><rect x="16" y="406" width="320" height="36" rx="8" fill="#f1dec0"/><text x="29" y="429" font-size="14" fill="#4d3517">决定已成而回复丢了：客户端仍可能不知道。</text></g></svg>