<svg xmlns="http://www.w3.org/2000/svg" width="352" height="420" viewBox="0 0 352 420" role="img" aria-labelledby="title desc"><title id="title">订单 71：归谁管，与一份数据存几处</title><desc id="desc">原目录把订单号一到一百交给分片甲。分片甲在两个故障域存储相同订单；库存按商品码另分片。事务同时写订单与库存时，两个分片各自复制还不够。</desc><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif"><rect width="352" height="420" rx="14" fill="#102637"/><text x="18" y="34" font-size="21" font-weight="700" fill="#fff">订单 71 到底有几份？</text><text x="18" y="58" font-size="14" fill="#c8dbe5">先找逻辑归属，再数物理副本。</text><rect x="16" y="78" width="320" height="62" rx="8" fill="#dcecf6"/><text x="29" y="104" font-size="16" fill="#133044" font-weight="700">① 目录：按 order_id 分片</text><text x="29" y="127" font-size="14" fill="#133044">1–100 → 甲　　101–200 → 乙</text><path d="M174 143v15m-5-6 5 6 5-6" stroke="#e1f1f7" stroke-width="2" fill="none"/><rect x="16" y="164" width="320" height="116" rx="8" fill="#dcf4e8"/><text x="29" y="190" font-size="16" font-weight="700" fill="#164936">② 分片甲：同一份订单状态</text><rect x="29" y="206" width="136" height="51" rx="7" fill="#21664c"/><rect x="181" y="206" width="141" height="51" rx="7" fill="#21664c"/><g fill="white" font-size="14" text-anchor="middle"><text x="97" y="227">故障域 A · 主</text><text x="97" y="247">订单 71</text><text x="251" y="227">故障域 B · 副</text><text x="251" y="247">订单 71</text></g><text x="29" y="273" font-size="12" fill="#164936">按订单号查一次，不会返回两笔订单。</text><rect x="16" y="294" width="320" height="106" rx="8" fill="#ffedcd"/><text x="29" y="321" font-size="16" font-weight="700" fill="#653e14">③ 另一分片丙：商品 Q 的库存</text><text x="29" y="349" font-size="14" fill="#55380f">只写订单：甲组内部的问题。</text><text x="29" y="372" font-size="14" fill="#55380f">写订单并扣库存：甲、丙须同进退。</text><text x="29" y="392" font-size="12" fill="#55380f">甲有两个副本，不等于丙已参加提交。</text></g></svg>