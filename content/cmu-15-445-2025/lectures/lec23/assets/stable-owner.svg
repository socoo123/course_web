<svg xmlns="http://www.w3.org/2000/svg" width="352" height="430" viewBox="0 0 352 430" role="img" aria-labelledby="title desc"><title id="title">插入分区 C，只改一小段归属</title><desc id="desc">将顺时针哈希环从坐标零展开。原有 A 位于二十、B 位于八十。在五十新增 C 后，二十之后至五十的键改归 C；例子中哈希值三十五的订单移走，七十和九十不变。下方用另外一组独立分数示意 rendezvous hashing。</desc><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif"><rect width="352" height="430" rx="14" fill="#f4f6f8"/><text x="18" y="32" font-size="20" font-weight="700" fill="#102e44">加一个分区，谁要搬？</text><text x="18" y="57" font-size="14" fill="#345267">环从 0 剪开；往右找，末端绕回起点。</text><text x="18" y="90" font-size="15" font-weight="700" fill="#163e57">原环</text><g stroke="#244859" stroke-width="3"><path d="M28 121h295m-8-5 8 5-8 5" fill="none"/><path d="M87 113v16m177-16v16"/></g><text x="87" y="108" font-size="15" text-anchor="middle" fill="#12384b">A·20</text><text x="264" y="108" font-size="15" text-anchor="middle" fill="#12384b">B·80</text><text x="18" y="164" font-size="15" font-weight="700" fill="#163e57">新环</text><path d="M28 198h295m-8-5 8 5-8 5" fill="none" stroke="#244859" stroke-width="3"/><path d="M87 198h88" stroke="#d48420" stroke-width="8"/><g stroke="#244859" stroke-width="3"><path d="M87 189v17m88-17v17m89-17v17"/></g><g font-size="15" text-anchor="middle"><text x="87" y="185" fill="#12384b">A·20</text><text x="175" y="185" font-weight="700" fill="#774309">C·50</text><text x="264" y="185" fill="#12384b">B·80</text></g><text x="18" y="236" font-size="15" fill="#203c50">哈希值 35：B → C（只有这段换主）</text><text x="18" y="260" font-size="15" fill="#203c50">70 仍归 B；90 绕回，仍归 A。</text><rect x="15" y="281" width="322" height="131" rx="9" fill="#deecf0"/><text x="28" y="307" font-size="16" font-weight="700" fill="#123744">换一种算法：为每个候选打分</text><text x="28" y="334" font-size="14" fill="#203c50">假设键 x 的分数：A 61，B 84。</text><text x="28" y="357" font-size="14" fill="#203c50">若 C 得 79：原冠军 B 不变。</text><text x="28" y="380" font-size="14" fill="#203c50">若 C 得 91：只有新冠军取代 B。</text><text x="28" y="401" font-size="12" fill="#345267">分数是另一个例子，不是上方的环坐标。</text></g></svg>