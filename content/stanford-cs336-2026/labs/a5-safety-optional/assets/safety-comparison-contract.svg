<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 1010" role="img" aria-labelledby="title desc">
<title id="title">选做安全补充的三阶段与三种参照</title>
<desc id="desc">Llama 3.1 8B 基座经单轮混合数据监督微调得到 SFT 模型。SFT 模型分别成为可更新的 DPO 模型与固定不变的 reference，使用 HH 单轮偏好对训练。三阶段均需四项评估。AlpacaEval 的 GPT-4 Turbo 预生成参考文本与本地 Llama 3.3 70B 评委不是 DPO reference。原创流程图，不表示已执行实验。</desc>
<style>:root{color-scheme:light dark;--fg:CanvasText;--border:CanvasText;color:var(--fg)}text{fill:var(--fg);font:17px system-ui,-apple-system,"PingFang SC",sans-serif}.heading{font-size:20px;font-weight:700}.small{font-size:15px}.box,.arrow,.fixed{fill:none;stroke:var(--border);stroke-width:1.8}.fixed{stroke-dasharray:6 5}.tip{fill:var(--fg)}</style>
<text class="heading" x="24" y="34">先分角色，再比较效果</text>
<rect class="box" x="24" y="55" width="382" height="70" rx="9"/>
<text x="43" y="84">Llama 3.1 8B base</text><text class="small" x="43" y="109">零样本：共同 system 外层</text>
<path class="arrow" d="M215 125V163"/><path class="tip" d="M209 154L215 165L221 154Z"/>
<text class="small" x="25" y="148">指定单轮混合数据 · SFT</text>
<rect class="box" x="24" y="172" width="382" height="76" rx="9"/>
<text x="43" y="203">自己的 SFT model ＋ tokenizer</text><text class="small" x="43" y="228">完整文档 LM；不是正篇 response mask</text>
<path class="arrow" d="M215 248V274H112V295 M215 274H318V295"/>
<path class="tip" d="M106 286L112 297L118 286Z M312 286L318 297L324 286Z"/>
<rect class="box" x="24" y="305" width="181" height="98" rx="9"/>
<text x="42" y="337">训练模型 πθ</text><text class="small" x="42" y="365">从 SFT 初始化</text><text class="small" x="42" y="388">有梯度、会更新</text>
<rect class="fixed" x="224" y="305" width="182" height="98" rx="9"/>
<text x="240" y="337">reference πref</text><text class="small" x="240" y="365">同一 SFT 副本</text><text class="small" x="240" y="388">冻结、不更新</text>
<path class="arrow" d="M112 403V431H215 M318 403V431H215V452"/><path class="tip" d="M209 443L215 454L221 443Z"/>
<rect class="box" x="24" y="463" width="382" height="100" rx="9"/>
<text x="43" y="495">HH：同一 instruction 的偏好对</text><text class="small" x="43" y="520">过滤多轮；四 training collections</text><text class="small" x="43" y="544">DPO 比相对 log-probability 变化</text>
<path class="arrow" d="M215 563V590"/><path class="tip" d="M209 581L215 592L221 581Z"/>
<rect class="box" x="24" y="602" width="382" height="90" rx="9"/>
<text x="43" y="632">三阶段都看四个维度</text><text class="small" x="43" y="657">MMLU · GSM8K · AlpacaEval · SST</text><text class="small" x="43" y="680">SFT／DPO 改用 Alpaca 外层</text>
<text class="heading" x="25" y="734">评估的“参考”另有其物</text>
<rect class="fixed" x="24" y="754" width="382" height="79" rx="9"/>
<text x="43" y="785">GPT-4 Turbo 预生成参考文本</text><text class="small" x="43" y="813">固定比较对象；不是现场付费 API</text>
<rect class="box" x="24" y="850" width="382" height="83" rx="9"/>
<text x="43" y="881">本地 Llama 3.3 70B judge</text><text class="small" x="43" y="907">给偏好／安全标签；不是训练 reference</text>
<text class="small" x="25" y="969">原创概念流程；没有运行、分数或曲线。</text>
<text class="small" x="25" y="992">高分只属于特定协议，不是安全证明。</text>
</svg>
