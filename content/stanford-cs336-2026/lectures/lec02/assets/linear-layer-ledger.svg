<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 630" role="img" aria-labelledby="title desc">
  <title id="title">一个线性层的三次张量收缩</title>
  <desc id="desc">前向将B乘D的输入与D乘K的权重相乘，输出B乘K；反向输入梯度将B乘K的上游梯度与K乘D的转置权重相乘；参数梯度将D乘B的转置输入与B乘K的上游梯度相乘。三个操作各约2BDK次浮点运算，分别对D、K、B求和。</desc>
  <style>
    text { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: var(--fg, #64748b); }
    .heading { font-size: 25px; font-weight: 700; }
    .label { font-size: 21px; font-weight: 650; }
    .formula { font-size: 24px; }
    .detail { font-size: 19px; }
    .card { fill: none; stroke: var(--fg, #64748b); stroke-width: 1.5; }
    .rule { stroke: var(--fg, #64748b); stroke-width: 1.3; }
  </style>
  <text class="heading" x="36" y="43">同一组 B、D、K，保留不同的轴</text>
  <text class="detail" x="36" y="77">G 是损失对输出 Y 的梯度，形状为 (B, K)</text>
  <rect class="card" x="30" y="102" width="660" height="135" rx="12"/>
  <text class="label" x="50" y="134">① 前向：Y = XW</text>
  <text class="formula" x="50" y="176">(B, D) × (D, K) → (B, K)</text>
  <text class="detail" x="50" y="213">对 D 求和；保留 B、K；约 2BDK FLOPs</text>
  <rect class="card" x="30" y="254" width="660" height="135" rx="12"/>
  <text class="label" x="50" y="286">② 反向输入：∇X = GWᵀ</text>
  <text class="formula" x="50" y="328">(B, K) × (K, D) → (B, D)</text>
  <text class="detail" x="50" y="365">对 K 求和；保留 B、D；约 2BDK FLOPs</text>
  <rect class="card" x="30" y="406" width="660" height="135" rx="12"/>
  <text class="label" x="50" y="438">③ 反向参数：∇W = XᵀG</text>
  <text class="formula" x="50" y="480">(D, B) × (B, K) → (D, K)</text>
  <text class="detail" x="50" y="517">对 B 求和；保留 D、K；约 2BDK FLOPs</text>
  <line class="rule" x1="36" y1="562" x2="684" y2="562"/>
  <text class="detail" x="36" y="591">只有同时需要两支梯度时，才把三项全部计入。</text>
  <text class="detail" x="36" y="617">dtype 决定字节与硬件速度，不改变逻辑乘加次数。</text>
</svg>
