<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 465" role="img" aria-labelledby="title desc">
<style>:root{color-scheme:light dark;--fg:CanvasText;--muted:CanvasText;--border:CanvasText;color:var(--fg)}</style>
<title id="title">长度10的数据分给三个宽4的program</title><desc id="desc">program0负责索引0至3，program1负责4至7，program2的逻辑tile含8至11，但只有8和9有效，10和11必须被load与store掩码排除。每格是逻辑元素，不代表一个物理线程。</desc>
<style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:var(--fg,#64748b);font-size:23px}.head{font-size:25px;font-weight:700}.small{font-size:20px}.box{fill:none;stroke:var(--border,#64748b);stroke-width:2}.bad{fill:none;stroke:var(--warning,#64748b);stroke-width:2;stroke-dasharray:5 4}.rule{stroke:var(--warning,#64748b);stroke-width:2}</style>
<text class="head" x="25" y="37">元素归属：i = p × 4 + r</text><text class="small" x="25" y="76">N = 10，B = 4；每个索引只属于一个program</text>
<text x="25" y="139">p = 0</text><rect class="box" x="145" y="100" width="100" height="60"/><rect class="box" x="245" y="100" width="100" height="60"/><rect class="box" x="345" y="100" width="100" height="60"/><rect class="box" x="445" y="100" width="100" height="60"/>
<text x="185" y="139">0</text><text x="285" y="139">1</text><text x="385" y="139">2</text><text x="485" y="139">3</text>
<text x="25" y="224">p = 1</text><rect class="box" x="145" y="185" width="100" height="60"/><rect class="box" x="245" y="185" width="100" height="60"/><rect class="box" x="345" y="185" width="100" height="60"/><rect class="box" x="445" y="185" width="100" height="60"/>
<text x="185" y="224">4</text><text x="285" y="224">5</text><text x="385" y="224">6</text><text x="485" y="224">7</text>
<text x="25" y="309">p = 2</text><rect class="box" x="145" y="270" width="100" height="60"/><rect class="box" x="245" y="270" width="100" height="60"/><rect class="bad" x="345" y="270" width="100" height="60"/><rect class="bad" x="445" y="270" width="100" height="60"/>
<text x="185" y="309">8</text><text x="285" y="309">9</text><text x="380" y="309">10</text><text x="480" y="309">11</text><path class="rule" d="M355 320L435 280M455 320L535 280"/>
<text class="small" x="25" y="376">i &lt; N 才能访存；逻辑位置不等于合法地址</text>
<text class="small" x="25" y="410">无效值若参与归约，还需正确的填充值</text>
<text class="small" x="25" y="444">每格不是线程；编译器可以让一线程处理多格</text>
</svg>
