<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 580" role="img" aria-labelledby="title desc">
<style>:root{color-scheme:light dark;--fg:CanvasText;--muted:CanvasText;--border:CanvasText;color:var(--fg)}</style>
  <title id="title">在线softmax把分子分母一起换到共同尺度</title>
  <desc id="desc">四个分数为log1、log2、log4、log1，value为2、负1、3、6。块A最大值log2，分母3/2，分子0。块B最大值log4，分母5/4，分子9/2。合并参考点为log4，A的分子和分母都乘1/2，B保持不变；新分母2，分子9/2，最终输出9/4。</desc>
  <style>
    text { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: var(--fg, #64748b); }
    .heading { font-size: 23px; font-weight: 700; }
    .body { font-size: 20px; }
    .small { font-size: 18px; }
    .card { fill: none; stroke: var(--border, #64748b); stroke-width: 1.6; }
    .arrow { fill: none; stroke: var(--accent, #64748b); stroke-width: 2; }
  </style>
  <text class="heading" x="25" y="35">新最大值更大：旧贡献应缩小</text>
  <rect class="card" x="25" y="57" width="450" height="100" rx="12"/>
  <text class="body" x="43" y="87">A：m = log 2，ℓ = 3/2，u = 0</text>
  <text class="small" x="43" y="119">旧尺度的分母与分子都乘 1/2</text>
  <text class="small" x="43" y="144">得到共同尺度贡献：ℓ = 3/4，u = 0</text>
  <rect class="card" x="25" y="178" width="450" height="100" rx="12"/>
  <text class="body" x="43" y="208">B：m = log 4，ℓ = 5/4，u = 9/2</text>
  <text class="small" x="43" y="240">已经在新尺度：分母与分子都乘 1</text>
  <text class="small" x="43" y="265">不能把两个块的局部输出简单平均</text>
  <path class="arrow" d="M250 285 V316 M242 307 L250 316 L258 307"/>
  <rect class="card" x="25" y="329" width="450" height="145" rx="12"/>
  <text class="heading" x="43" y="361">合并：共同参考点 m = log 4</text>
  <text class="body" x="43" y="395">ℓ = 3/4 + 5/4 = 2</text>
  <text class="body" x="43" y="427">u = 0 + 9/2 = 9/2</text>
  <text class="body" x="43" y="459">输出 o = u / ℓ = 9/4</text>
  <text class="small" x="25" y="514">不变量：ℓ和u始终使用同一个指数参考点</text>
  <text class="small" x="25" y="546">全部数字为原创手算，不是性能测量</text>
</svg>
