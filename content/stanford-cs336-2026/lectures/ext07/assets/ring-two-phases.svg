<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="title desc">
<style>:root{color-scheme:light dark;--fg:CanvasText;--muted:CanvasText;--border:CanvasText;color:var(--fg)}</style>
  <title id="title">四个rank中块0的ring all-reduce路径</title>
  <desc id="desc">第一阶段块0从rank0经过rank1和rank2到rank3，沿途归约，每轮加入一个rank的贡献。第二阶段完成的块0从rank3经过rank0和rank1到rank2，只复制不再相加。每卡完整向量128 MiB，分为四块，每阶段每卡发送96 MiB。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent, currentColor)"/></marker></defs>
  <g font-family="system-ui, sans-serif" fill="var(--fg, currentColor)">
    <text x="20" y="36" font-size="25" font-weight="700">一块数据，两种动作</text>
    <text x="20" y="70" font-size="19" fill="var(--muted, currentColor)">只追踪块0；另外三块同时交错流动</text>
    <text x="20" y="117" font-size="22" font-weight="600">① Reduce-scatter：接收后加入本地贡献</text>
    <g fill="none" stroke="var(--border, currentColor)" stroke-width="2">
      <rect x="20" y="145" width="112" height="83" rx="10"/><rect x="180" y="145" width="112" height="83" rx="10"/><rect x="340" y="145" width="112" height="83" rx="10"/><rect x="500" y="145" width="112" height="83" rx="10"/>
    </g>
    <g text-anchor="middle" font-size="20">
      <text x="76" y="176">rank 0</text><text x="236" y="176">rank 1</text><text x="396" y="176">rank 2</text><text x="556" y="176">rank 3</text>
      <text x="76" y="208">1份贡献</text><text x="236" y="208">2份贡献</text><text x="396" y="208">3份贡献</text><text x="556" y="208" fill="var(--success, currentColor)">4份完整</text>
    </g>
    <g fill="none" stroke="var(--accent, currentColor)" stroke-width="3" marker-end="url(#arrow)"><path d="M136 185H174"/><path d="M296 185H334"/><path d="M456 185H494"/></g>
    <text x="20" y="279" font-size="22" font-weight="600">② All-gather：转发完成块，不再相加</text>
    <g fill="none" stroke="var(--success, currentColor)" stroke-width="2">
      <rect x="20" y="305" width="112" height="78" rx="10"/><rect x="180" y="305" width="112" height="78" rx="10"/><rect x="340" y="305" width="112" height="78" rx="10"/><rect x="500" y="305" width="112" height="78" rx="10"/>
    </g>
    <g text-anchor="middle" font-size="20"><text x="76" y="337">rank 3</text><text x="236" y="337">rank 0</text><text x="396" y="337">rank 1</text><text x="556" y="337">rank 2</text><text x="76" y="367">完成块0</text><text x="236" y="367">完成块0</text><text x="396" y="367">完成块0</text><text x="556" y="367">完成块0</text></g>
    <g fill="none" stroke="var(--accent, currentColor)" stroke-width="3" marker-end="url(#arrow)"><path d="M136 345H174"/><path d="M296 345H334"/><path d="M456 345H494"/></g>
    <text x="20" y="430" font-size="21">每卡128 MiB → 每块32 MiB</text>
    <text x="20" y="466" font-size="21">每卡发送：3 × 32 × 2 = 192 MiB</text>
  </g>
</svg>
