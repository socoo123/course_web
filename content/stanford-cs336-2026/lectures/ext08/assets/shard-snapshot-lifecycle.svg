<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 550" role="img" aria-labelledby="title desc">
<style>:root{color-scheme:light dark;--fg:CanvasText;--muted:CanvasText;--border:CanvasText;color:var(--fg)}</style>
  <title id="title">分片所有权、临时完整参数与一致检查点</title>
  <desc id="desc">持久本地分片始终保留。前向和反向使用前各收集完整参数，用后释放；完整副本不是新的优化器所有者。完成更新t之后，模型、优化器、数据游标与RNG一起形成一致快照，staging完成后才能安全修改原状态，写出完成后才发布新代。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--accent, currentColor)"/></marker></defs>
  <g font-family="system-ui, sans-serif" fill="var(--fg, currentColor)">
    <text x="20" y="35" font-size="25" font-weight="700">所有权不变，完整副本按需出现</text>
    <g fill="none" stroke="var(--border, currentColor)" stroke-width="2"><rect x="20" y="62" width="620" height="60" rx="10"/></g>
    <text x="40" y="100" font-size="22">持久分片：本rank负责保存与更新</text>
    <path d="M45 240H615" fill="none" stroke="var(--muted, currentColor)" stroke-width="2" marker-end="url(#arrow)"/>
    <g fill="none" stroke="var(--accent, currentColor)" stroke-width="2"><rect x="70" y="147" width="220" height="69" rx="8"/><rect x="355" y="147" width="220" height="69" rx="8"/></g>
    <g text-anchor="middle" font-size="21"><text x="180" y="176">完整参数：前向使用</text><text x="180" y="202">收集 → 计算 → 释放</text><text x="465" y="176">完整参数：反向使用</text><text x="465" y="202">收集 → 计算 → 释放</text></g>
    <text x="25" y="280" font-size="20" fill="var(--muted, currentColor)">完整副本驻留期间，激活和预取也可能占内存</text>
    <path d="M20 305H640" stroke="var(--border, currentColor)" stroke-width="2"/>
    <text x="20" y="345" font-size="24" font-weight="700">检查点：所有状态必须属于同一时刻t</text>
    <g fill="none" stroke="var(--success, currentColor)" stroke-width="2"><rect x="20" y="370" width="620" height="62" rx="9"/></g>
    <text x="40" y="409" font-size="22">模型 + 优化器 + 调度 + 数据游标 + RNG</text>
    <g fill="none" stroke="var(--accent, currentColor)" stroke-width="2" marker-end="url(#arrow)"><path d="M175 474H242"/><path d="M428 474H483"/></g>
    <g font-size="21" text-anchor="middle"><text x="98" y="480">一致边界</text><text x="335" y="469">staging完成</text><text x="335" y="498" fill="var(--muted, currentColor)">原状态可继续更新</text><text x="562" y="469">写出完成</text><text x="562" y="498" fill="var(--muted, currentColor)">按协议发布</text></g>
    <text x="20" y="537" font-size="18" fill="var(--muted, currentColor)">示意非实测；设备依赖、复制保护与存储可靠性须另外满足</text>
  </g>
</svg>
