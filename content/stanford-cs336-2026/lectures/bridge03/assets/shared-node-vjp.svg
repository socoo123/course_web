<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 490" role="img" aria-labelledby="title desc">
  <title id="title">共享节点的反向贡献相加</title>
  <desc id="desc">自拟标量计算图：x等于2，u等于x的平方得到4。u分别进入a等于3u和b等于u的平方，得到12和16，最后L等于a加b得到28。反向两条路径对u的贡献是3与8，合并为11后，再乘2x得到对x的梯度44。</desc>
  <style>
    :root { color-scheme: light dark; }
    text { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: var(--fg, currentColor); text-anchor: middle; }
    .heading { font-size: 20px; font-weight: 700; }
    .formula { font-size: 19px; font-weight: 650; }
    .detail { font-size: 16px; }
    .box { fill: none; stroke: var(--fg, currentColor); stroke-width: 1.5; }
    .edge { fill: none; stroke: var(--accent, currentColor); stroke-width: 1.8; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent, currentColor)"/>
    </marker>
  </defs>
  <text class="heading" x="195" y="29">前向分支，反向汇合</text>
  <rect class="box" x="105" y="48" width="180" height="64" rx="10"/>
  <text class="formula" x="195" y="74">x = 2</text>
  <text class="detail" x="195" y="99">梯度：11 × 4 = 44</text>
  <path class="edge" d="M195 112 V143"/>
  <rect class="box" x="75" y="146" width="240" height="74" rx="10"/>
  <text class="formula" x="195" y="174">共享节点 u = x² = 4</text>
  <text class="detail" x="195" y="202">先合并贡献：3 + 8 = 11</text>
  <path class="edge" d="M135 220 L95 262"/>
  <path class="edge" d="M255 220 L295 262"/>
  <rect class="box" x="15" y="266" width="160" height="78" rx="10"/>
  <rect class="box" x="215" y="266" width="160" height="78" rx="10"/>
  <text class="formula" x="95" y="295">a = 3u = 12</text>
  <text class="detail" x="95" y="324">传回 u：1 × 3</text>
  <text class="formula" x="295" y="295">b = u² = 16</text>
  <text class="detail" x="295" y="324">传回 u：1 × 8</text>
  <path class="edge" d="M95 344 L150 389"/>
  <path class="edge" d="M295 344 L240 389"/>
  <rect class="box" x="75" y="393" width="240" height="64" rx="10"/>
  <text class="formula" x="195" y="420">L = a + b = 28</text>
  <text class="detail" x="195" y="445">反向种子：∂L/∂L = 1</text>
  <text class="detail" x="195" y="482">箭头是前向依赖；导数逆向传递</text>
</svg>
