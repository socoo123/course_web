<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="title desc">
<style>:root{color-scheme:light dark;--fg:CanvasText;--muted:CanvasText;--border:CanvasText;color:var(--fg)}</style>
  <title id="title">ZeRO 模型状态分片与实际峰值内存的差别</title>
  <desc id="desc">阶段三长期保存参数、梯度、优化器状态的本地分片。但执行一层时仍可能需要临时完整的计算参数，以及激活、通信和其他工作区。实际峰值是同一时刻驻留对象的总和，不是长期分片状态公式单独决定。</desc>
  <g font-family="system-ui, sans-serif" fill="var(--fg, currentColor)" font-size="23">
    <text x="24" y="38" font-weight="700">每个 rank：长期分片 ≠ 全部驻留量</text>
    <rect x="24" y="66" width="592" height="114" rx="10" fill="none" stroke="var(--c1, currentColor)" stroke-width="3"/>
    <text x="44" y="105" font-weight="700">长期所有权</text>
    <text x="44" y="142">本地参数片段 + 梯度片段 + 优化器状态</text>
    <text x="320" y="216" text-anchor="middle" font-size="30">+</text>
    <rect x="24" y="235" width="592" height="94" rx="10" fill="none" stroke="var(--c2, currentColor)" stroke-width="3"/>
    <text x="44" y="273" font-weight="700">临时完整计算单元</text>
    <text x="44" y="310">当前层需要的参数；可能还有下一层预取</text>
    <text x="320" y="365" text-anchor="middle" font-size="30">+</text>
    <rect x="24" y="383" width="592" height="94" rx="10" fill="none" stroke="var(--c3, currentColor)" stroke-width="3"/>
    <text x="44" y="421" font-weight="700">其他驻留与保留</text>
    <text x="44" y="458">激活、通信 buffer、算子工作区、分配器保留</text>
    <text x="320" y="510" text-anchor="middle" fill="var(--muted, currentColor)" font-size="20">峰值取决于时间上的重叠；图中方框不按容量比例绘制</text>
  </g>
</svg>
