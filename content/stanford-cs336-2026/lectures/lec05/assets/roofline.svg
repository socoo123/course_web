<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" role="img" aria-labelledby="title desc">
<style>:root{color-scheme:light dark;--fg:CanvasText;--muted:CanvasText;--border:CanvasText;color:var(--fg)}</style>
<title id="title">Roofline上界与优化方向</title><desc id="desc">纵轴是可达吞吐，横轴是同一内存层级的算术强度。左侧带宽上界随强度增加，右侧由计算峰值封顶。提高复用减少慢层传输使点向右移动，提高峰值不一定改善左侧带宽限制。该图是定性示意，没有实测数据。</desc>
<style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:var(--fg,#64748b);font-size:22px}.head{font-size:25px;font-weight:700}.small{font-size:20px}.axis{fill:none;stroke:var(--fg,#64748b);stroke-width:2}.roof{fill:none;stroke:var(--accent,#64748b);stroke-width:4}.guide{fill:none;stroke:var(--muted,#64748b);stroke-width:2;stroke-dasharray:6 5}</style>
<text class="head" x="25" y="37">先问：这份强度对应哪层内存？</text>
<path class="axis" d="M70 310V78M70 310H555"/><path class="axis" d="M63 88L70 78L77 88M545 303L555 310L545 317"/>
<text x="83" y="87">可达吞吐 P</text><path class="roof" d="M95 283L305 127H550"/>
<path class="guide" d="M305 127V310"/><text x="355" y="116">计算上界 C</text>
<text x="79" y="180">带宽上界 βI</text><text class="small" x="92" y="213">搬运受限区</text>
<text class="small" x="355" y="187">计算受限区</text><text class="small" x="255" y="340">转折点 C / β</text>
<text class="small" x="180" y="374">算术强度 I = FLOP / byte →</text>
<text class="small" x="25" y="417">复用更多：同一工作量下，减少Q，向右移</text>
<text class="small" x="25" y="450">启动、尾块、同步会让实测落在上界下方</text>
<text class="small" x="25" y="482">原创定性图；对数概念刻度，无实测点</text>
</svg>
