<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 590" role="img" aria-labelledby="title desc">
<style>:root{color-scheme:light dark;--fg:CanvasText;--muted:CanvasText;--border:CanvasText;color:var(--fg)}</style>
  <title id="title">一个token的两条MoE分派边与加权回程</title>
  <desc id="desc">token t2选择专家e0和e2。两条分派保留原token身份，专家分别输出向量2,4和负1,3，按0.75和0.25合并得到1.25,3.75。若容量策略拒绝e0边且不重新归一化，结果为负0.25,0.75；删除的是专家分派，不是序列token。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--accent, currentColor)"/></marker></defs>
  <g font-family="system-ui, sans-serif" fill="var(--fg, currentColor)">
    <text x="20" y="36" font-size="25" font-weight="700">Dispatch：复制分派，不丢token身份</text>
    <g fill="none" stroke="var(--border, currentColor)" stroke-width="2"><rect x="225" y="65" width="210" height="57" rx="10"/></g>
    <text x="330" y="102" text-anchor="middle" font-size="23">原token t2</text>
    <g fill="none" stroke="var(--accent, currentColor)" stroke-width="3" marker-end="url(#arrow)"><path d="M265 124L160 185"/><path d="M395 124L500 185"/></g>
    <g font-size="19" fill="var(--muted, currentColor)"><text x="57" y="155">t2 / slot 0</text><text x="485" y="155">t2 / slot 1</text></g>
    <g fill="none" stroke="var(--accent, currentColor)" stroke-width="2"><rect x="45" y="195" width="230" height="88" rx="10"/><rect x="385" y="195" width="230" height="88" rx="10"/></g>
    <g text-anchor="middle" font-size="22"><text x="160" y="228">专家e0</text><text x="160" y="262">输出 (2, 4)</text><text x="500" y="228">专家e2</text><text x="500" y="262">输出 (−1, 3)</text></g>
    <g fill="none" stroke="var(--accent, currentColor)" stroke-width="3" marker-end="url(#arrow)"><path d="M160 286L270 347"/><path d="M500 286L390 347"/></g>
    <g font-size="21"><text x="82" y="324">× 0.75</text><text x="505" y="324">× 0.25</text></g>
    <g fill="none" stroke="var(--success, currentColor)" stroke-width="2"><rect x="135" y="360" width="390" height="72" rx="10"/></g>
    <text x="330" y="391" text-anchor="middle" font-size="22">Combine：回到t2并求和</text><text x="330" y="419" text-anchor="middle" font-size="23" fill="var(--success, currentColor)">(1.25, 3.75)</text>
    <path d="M20 455H640" stroke="var(--border, currentColor)" stroke-width="2"/>
    <text x="20" y="489" font-size="21" font-weight="600">若容量策略拒绝e0边（不重归一化）</text>
    <path d="M40 520H170" fill="none" stroke="var(--error, currentColor)" stroke-width="3" stroke-dasharray="7 5"/>
    <path d="M178 510L198 530M198 510L178 530" stroke="var(--error, currentColor)" stroke-width="3"/>
    <text x="215" y="527" font-size="21">剩余结果：0.25 × (−1, 3)</text>
    <text x="20" y="567" font-size="20" fill="var(--muted, currentColor)">t2位置仍在；改变的是专家分支的贡献</text>
  </g>
</svg>
