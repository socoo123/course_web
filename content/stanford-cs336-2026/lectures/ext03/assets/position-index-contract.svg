<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 670" role="img" aria-labelledby="title desc">
  <title id="title">局部槽位不等于逻辑位置</title>
  <desc id="desc">先处理逻辑位置0到3，再追加一个token。新增token在当前张量中的槽位是0，但逻辑位置是4。对位置1的旧key，正确的key减query位移是负3；只把新增query重置到0会得到正1。共同平移两边才能保持位移。</desc>
  <style>
    :root { color-scheme: light dark; }
    text { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: var(--fg, currentColor); }
    .title { font-size: 27px; font-weight: 700; }
    .heading { font-size: 24px; font-weight: 650; }
    .label { font-size: 23px; }
    .detail { font-size: 22px; }
    .card, .cell { fill: none; stroke: var(--fg, currentColor); stroke-width: 1.6; }
    .accent { stroke: var(--accent, currentColor); stroke-width: 2.4; stroke-dasharray: 5 3; fill: none; }
    .rule { stroke: var(--fg, currentColor); stroke-width: 1.4; }
  </style>
  <text class="title" x="24" y="40">同一个token，有不同编号</text>
  <text class="detail" x="24" y="77">示例：已有4个位置，再追加1个token</text>
  <rect class="card" x="20" y="100" width="520" height="150" rx="12"/>
  <text class="heading" x="38" y="135">已经处理的前缀</text>
  <text class="label" x="38" y="187">逻辑位置</text>
  <rect class="cell" x="172" y="158" width="66" height="44" rx="6"/>
  <rect class="accent" x="244" y="158" width="66" height="44" rx="6"/>
  <rect class="cell" x="316" y="158" width="66" height="44" rx="6"/>
  <rect class="cell" x="388" y="158" width="66" height="44" rx="6"/>
  <text class="label" x="198" y="188">0</text>
  <text class="label" x="270" y="188">1</text>
  <text class="label" x="342" y="188">2</text>
  <text class="label" x="414" y="188">3</text>
  <text class="detail" x="38" y="232">取逻辑位置1的旧key作为比较对象</text>
  <rect class="card" x="20" y="270" width="520" height="158" rx="12"/>
  <text class="heading" x="38" y="307">当前只输入新增token</text>
  <text class="label" x="38" y="353">张量槽位：0</text>
  <text class="label" x="280" y="353">逻辑位置：4</text>
  <text class="detail" x="38" y="398">缓存存在哪个槽位，不定义它的位置ID</text>
  <rect class="card" x="20" y="448" width="520" height="150" rx="12"/>
  <text class="heading" x="38" y="485">检查 key位置 − query位置</text>
  <text class="label" x="38" y="527">正确：1 − 4 = −3</text>
  <text class="label" x="38" y="570">只重置query：1 − 0 = 1（不一致）</text>
  <line class="rule" x1="24" y1="618" x2="536" y2="618"/>
  <text class="detail" x="24" y="653">两边共同平移才保留相对位移。</text>
</svg>
